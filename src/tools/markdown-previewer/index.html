<div class="app">
  <header class="app-header">
    <div class="app-header-row">
      <div class="header-titles">
        <h1>Markdown Previewer</h1>
        <p class="subtitle">A live split-pane Markdown editor &amp; preview — hand-rolled Markdown&nbsp;→&nbsp;HTML, all local.</p>
      </div>
      <button
        id="help-button"
        type="button"
        class="help-button"
        data-testid="help-button"
        title="How it works"
        aria-label="How it works"
      >?</button>
    </div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Actions">
    <button type="button" id="viewToggleBtn" data-testid="view-toggle" class="toggle" aria-pressed="true" title="Toggle side-by-side / top-and-bottom layout">Side by side</button>
    <button type="button" id="syncToggleBtn" data-testid="sync-toggle" class="toggle" aria-pressed="false" title="Sync editor and preview scrolling">Sync scroll</button>
    <button type="button" id="copyHtmlBtn" data-testid="copy-html-btn" title="Copy the rendered HTML to the clipboard">Copy HTML</button>
    <button type="button" id="clearBtn" data-testid="clear-btn" title="Clear the editor">Clear</button>
    <button type="button" id="loadSampleBtn" data-testid="load-sample-btn" title="Fill the editor with a Markdown cheat-sheet">Load sample</button>
  </div>

  <div class="split">
    <section class="pane editor-pane">
      <label class="pane-label" for="editor">Markdown</label>
      <div class="ct-field ct-field--multiline editor-field">
        <textarea id="editor" data-testid="editor" spellcheck="false"
          placeholder="Type Markdown here…  (or press “Load sample”)"
          aria-label="Markdown editor"></textarea>
        <button type="button" id="copyMdBtn" class="ct-copy-btn" data-testid="editor-copy-btn"
          title="Copy the Markdown source" aria-label="Copy the Markdown source" hidden>📋</button>
      </div>
    </section>

    <section class="pane preview-pane">
      <div class="pane-label" id="preview-label">Preview</div>
      <div id="preview" data-testid="preview" class="markdown-body" tabindex="0"
        role="region" aria-label="Rendered preview" aria-live="off"></div>

<!-- Help modal built at runtime by the shared jbcModal primitive
     (CtModal in the shared lib) from this hidden template. The <h2> title comes
     from jbcModal's `title` option, so it is not repeated here. -->
<template id="help-body">
    <p>Type Markdown on the left; the rendered HTML appears live on the right. Everything runs locally in your browser — nothing you type is ever sent anywhere.</p>
    <ul>
      <li><strong>Live preview.</strong> The preview updates as you type (briefly debounced). On narrow screens the two panes stack vertically.</li>
      <li><strong>Side by side.</strong> Toggles the layout between side-by-side columns (the default) and a stacked top/bottom view where the editor is a smaller pane above a taller preview.</li>
      <li><strong>Sync scroll.</strong> When on, scrolling one pane scrolls the other proportionally.</li>
      <li><strong>Copy HTML.</strong> Copies the rendered HTML source to your clipboard.</li>
      <li><strong>Clear.</strong> Empties the editor (asks first, since that can be a lot of writing).</li>
      <li><strong>Load sample.</strong> Fills the editor with a cheat-sheet that exercises every supported construct.</li>
    </ul>
    <p><strong>Supported syntax:</strong> headings (<code>#</code>…<code>######</code> and setext), <strong>bold</strong>, <em>italic</em>, <del>strikethrough</del>, <code>inline code</code>, fenced &amp; indented code blocks, blockquotes (nestable), ordered/unordered/nested lists, task lists (<code>- [ ]</code>/<code>- [x]</code>), links, images, autolinks, reference links, horizontal rules, and pipe tables with alignment.</p>
    <p class="help-note">Raw HTML is escaped by default and dangerous URLs (like <code>javascript:</code>) are neutralized, so the preview can safely render anything you paste. Your editor text is remembered on this device.</p>
</template>

/*

 * ---------------------------------------------------------------------------
 * import { copy, flash } from '<rel>/jbc-include/components/CtClipboardUtil.mjs';
 * (or `CtClipboardUtil.copy` / `CtClipboardUtil.flash` via the aggregator class
 * at the bottom — statics REFERENCE the named bindings, single implementation.)
 *
 * Formerly the pasteable IIFE copy.js exposing the jbcCopy / jbcFlash window globals;
 * those globals are GONE. `copy` = ex-jbcCopy, `flash` = ex-jbcFlash — bodies
 * unchanged. The `.ctc-flash` CSS still self-injects on the first `flash()` call
 * (ensureStyles) and the `window.ctCopyStyles = false` opt-out is still honored.
 *
 * copy(text) -> Promise<boolean>
 * flash(el, opts?) -> void

 * a deterministic `measure`); the single-file build inlines this module body
 * into the shipped index.html — stripping the `export` — so the shipped tool
 * stays dependency-free and file://-openable. See the consuming repo's build
 * docs (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function wrapText(text, maxWidth, measure) {
  const src = text == null ? '' : String(text);
  const mw = Number(maxWidth);
  const limit = Number.isFinite(mw) ? mw : 0;
  const paras = src.split('\n');
  const out = [];
  for (const para of paras) {
    const words = para.split(/(\s+)/).filter((t) => t.length > 0);
    if (words.length === 0) { out.push(''); continue; }
    let line = '';
    for (const token of words) {
      const isSpace = /^\s+$/.test(token);
      const candidate = line + token;
      if (line === '') {
        line = isSpace ? '' : token;
        continue;
      }
      if (limit > 0 && measure(candidate) > limit && !isSpace) {
        out.push(line.replace(/\s+$/, ''));
        line = token;
      } else {
        line = candidate;
      }
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out.length ? out : [''];
}

// ===== Begin jbcMarkdown (ES module) =====
/*
 * jbcMarkdown — safe Markdown → HTML renderer (DOM-free, deterministic).
 * ---------------------------------------------------------------------------
 * A DOM-free, Node-importable ES module: a line-based block parser (parseBlocks)
 * plus an inline parser (parseInline), entry point mdToHtml(src, opts). No DOM,
 * no Date, no randomness — the same Markdown always produces byte-identical HTML.
 * Safety is baked in: raw HTML is always escaped (never passed through), and
 * link/image URLs are sanitized (sanitizeUrl blocks javascript:/vbscript:/data:
 * — a data: URL is allowed only for an image, only when the caller passes
 * opts.allowImage (default off), and only for a non-SVG data:image/ payload;
 * image/svg+xml stays blocked even with allowImage since SVG can carry script).
 * opts threads through mdToHtml -> parseBlocks -> parseInline -> link/image.
 * Also exports escapeHtmlForMarkdown / escapeAttrForMarkdown.
 *
 * A tool whose pure, unit-tested source/logic.mjs needs Markdown rendering
 * imports this module directly (so `node --test` can load it); the single-file
 * build inlines this module body into the shipped index.html — stripping each
 * `export` — so the shipped tool stays dependency-free and file://-openable. See
 * the consuming repo's build docs (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build.
 */

// ---- escaping --------------------------------------------------------
function escapeHtmlForMarkdown(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttrForMarkdown(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ---- URL sanitization ------------------------------------------------
// Decode numeric/hex HTML entities and strip control chars first (so a
// scheme can't be smuggled past the check), then block dangerous schemes.
// Returns the ORIGINAL url when safe (the caller attribute-escapes it), or
// '' when blocked.
function sanitizeUrl(url, opts = {}) {
  const raw = String(url ?? '').trim();
  if (raw === '') return '';
  const decoded = raw
    .replace(/&#x([0-9a-f]+);?/gi, (_m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&#(\d+);?/g, (_m, d) => String.fromCharCode(parseInt(d, 10)))
    .replace(/[\u0000-\u001f\u007f\s]/g, '');
  const scheme = (decoded.match(/^([a-z][a-z0-9+.-]*):/i) || [])[1];
  if (scheme) {
    const s = scheme.toLowerCase();
    if (s === 'javascript' || s === 'vbscript') return '';
    if (s === 'data') {
      // Allow a data: URL only for a non-SVG image payload and only when the caller opts in.
      // SVG can carry script, so image/svg+xml stays blocked even with allowImage (#1014-F).
      if (opts.allowImage && /^data:image\//i.test(decoded) && !/^data:image\/svg\b/i.test(decoded)) return raw;
      return '';
    }
  }
  return raw;
}

// ---- small line helpers ---------------------------------------------
const isBlank = (l) => /^[ \t]*$/.test(l);
const isFence = (l) => /^ {0,3}(`{3,}|~{3,})/.test(l);
const isAtx = (l) => /^ {0,3}#{1,6}(?:[ \t]|$)/.test(l);
const isHr = (l) =>
  /^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/.test(l);
const isBlockquote = (l) => /^ {0,3}>/.test(l);
const leadingSpaces = (l) => (l.match(/^ */) || [''])[0].length;

function matchListItem(line) {
  let m = line.match(/^( {0,3})([-+*])([ \t]+)([\s\S]*)$/);
  if (m) {
    return { indent: m[1].length, ordered: false, marker: m[2],
      delimiter: m[2], contentIndent: m[1].length + 1 + m[3].length,
      content: m[4], startNum: 1 };
  }
  m = line.match(/^( {0,3})(\d{1,9})([.)])([ \t]+)([\s\S]*)$/);
  if (m) {
    return { indent: m[1].length, ordered: true, marker: m[2],
      delimiter: m[3], contentIndent: m[1].length + m[2].length + 1 + m[4].length,
      content: m[5], startNum: parseInt(m[2], 10) };
  }
  // empty items: "-" or "1." on their own line
  m = line.match(/^( {0,3})([-+*])[ \t]*$/);
  if (m) {
    return { indent: m[1].length, ordered: false, marker: m[2],
      delimiter: m[2], contentIndent: m[1].length + 2, content: '', startNum: 1 };
  }
  m = line.match(/^( {0,3})(\d{1,9})([.)])[ \t]*$/);
  if (m) {
    return { indent: m[1].length, ordered: true, marker: m[2],
      delimiter: m[3], contentIndent: m[1].length + m[2].length + 2,
      content: '', startNum: parseInt(m[2], 10) };
  }
  return null;
}

const isTableDelimiterRow = (l) =>
  /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/.test(l) &&
  l.includes('-');

function isBlockStart(lines, i) {
  const l = lines[i];
  return (
    isFence(l) || isAtx(l) || isHr(l) || isBlockquote(l) ||
    matchListItem(l) ||
    (l.includes('|') && i + 1 < lines.length && isTableDelimiterRow(lines[i + 1]))
  );
}

// ---- table row splitting --------------------------------------------
function splitTableRow(line) {
  let s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
  const cells = [];
  let cur = '';
  for (let k = 0; k < s.length; k++) {
    if (s[k] === '\\' && s[k + 1] === '|') { cur += '|'; k++; continue; }
    if (s[k] === '|') { cells.push(cur); cur = ''; continue; }
    cur += s[k];
  }
  cells.push(cur);
  return cells.map((c) => c.trim());
}

// =====================================================================
// Inline parser
// =====================================================================

const PUNCT = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";

// Find the index of the matching ']' for a '[' at openIdx (depth + escape
// aware). Returns -1 if unbalanced.
function matchBracket(src, openIdx) {
  let depth = 0;
  for (let k = openIdx; k < src.length; k++) {
    const ch = src[k];
    if (ch === '\\') { k++; continue; }
    if (ch === '[') depth++;
    else if (ch === ']') { depth--; if (depth === 0) return k; }
  }
  return -1;
}

// Find the matching ')' for a '(' at openIdx.
function matchParen(src, openIdx) {
  let depth = 0;
  for (let k = openIdx; k < src.length; k++) {
    const ch = src[k];
    if (ch === '\\') { k++; continue; }
    if (ch === '(') depth++;
    else if (ch === ')') { depth--; if (depth === 0) return k; }
  }
  return -1;
}

// Parse a link destination string ("url", "<url>", "url \"title\"").
function parseDest(s) {
  const str = s.trim();
  if (str === '') return { url: '', title: '' };
  let url;
  let title = '';
  if (str[0] === '<') {
    const e = str.indexOf('>');
    if (e < 0) return null;
    url = str.slice(1, e);
    title = str.slice(e + 1).trim();
  } else {
    const m = str.match(/^(\S+)(?:[ \t]+([\s\S]+))?$/);
    if (!m) return null;
    url = m[1];
    title = (m[2] || '').trim();
  }
  if (title) {
    const t = title.match(/^"([\s\S]*)"$|^'([\s\S]*)'$|^\(([\s\S]*)\)$/);
    title = t ? (t[1] ?? t[2] ?? t[3]) : title;
  }
  return { url, title };
}

function refKey(s) {
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}

// Find the run of exactly `len` backticks starting at/after `from`.
function findCodeClose(src, from, len) {
  let k = from;
  while (k < src.length) {
    if (src[k] === '`') {
      let run = 0;
      while (src[k + run] === '`') run++;
      if (run === len) return k;
      k += run;
    } else {
      k++;
    }
  }
  return -1;
}

function parseInline(src, refs, opts) {
  refs = refs || {};
  opts = opts || {};
  const tokens = [];
  const stash = (html) => {
    tokens.push(html);
    return '\uE000' + (tokens.length - 1) + '\uE000';
  };

  let work = '';
  let i = 0;
  const n = src.length;

  while (i < n) {
    const c = src[i];

    // backslash escape / hard break
    if (c === '\\') {
      const next = src[i + 1];
      if (next === '\n') { work += stash('<br>\n'); i += 2; continue; }
      if (next && PUNCT.includes(next)) { work += stash(escapeHtmlForMarkdown(next)); i += 2; continue; }
      work += '\\'; i++; continue;
    }

    // inline code span
    if (c === '`') {
      let run = 0;
      while (src[i + run] === '`') run++;
      const close = findCodeClose(src, i + run, run);
      if (close >= 0) {
        let code = src.slice(i + run, close).replace(/\n/g, ' ');
        if (code.length > 1 && /^ /.test(code) && / $/.test(code) && /[^ ]/.test(code)) {
          code = code.slice(1, -1);
        }
        work += stash('<code>' + escapeHtmlForMarkdown(code) + '</code>');
        i = close + run;
        continue;
      }
      work += '`'.repeat(run); i += run; continue;
    }

    // autolink / email  (raw HTML otherwise gets escaped as text)
    if (c === '<') {
      const rest = src.slice(i);
      let m = rest.match(/^<([a-z][a-z0-9+.-]{1,31}:[^<>\s]*)>/i);
      if (m) {
        const safe = sanitizeUrl(m[1], opts);
        work += stash('<a href="' + escapeAttrForMarkdown(safe) + '">' + escapeHtmlForMarkdown(m[1]) + '</a>');
        i += m[0].length; continue;
      }
      m = rest.match(/^<([^\s<>@]+@[^\s<>@]+\.[^\s<>@]+)>/);
      if (m) {
        work += stash('<a href="mailto:' + escapeAttrForMarkdown(m[1]) + '">' + escapeHtmlForMarkdown(m[1]) + '</a>');
        i += m[0].length; continue;
      }
      work += '<'; i++; continue;
    }

    // image
    if (c === '!' && src[i + 1] === '[') {
      const r = parseLinkOrImage(src, i + 1, true, refs, stash, opts);
      if (r) { work += r.token; i = r.end; continue; }
      work += '!'; i++; continue;
    }

    // link
    if (c === '[') {
      const r = parseLinkOrImage(src, i, false, refs, stash, opts);
      if (r) { work += r.token; i = r.end; continue; }
      work += '['; i++; continue;
    }

    work += c; i++;
  }

  work = escapeHtmlForMarkdown(work);
  work = work.replace(/ {2,}\n/g, '<br>\n');
  work = applyEmphasis(work);
  work = work.replace(/\uE000(\d+)\uE000/g, (_m, d) => tokens[+d]);
  return work;
}

// openIdx points at the '[' (the label opener).
function parseLinkOrImage(src, openIdx, isImage, refs, stash, opts) {
  opts = opts || {};
  const close = matchBracket(src, openIdx);
  if (close < 0) return null;
  const text = src.slice(openIdx + 1, close);
  let j = close + 1;
  let url = null;
  let title = '';

  if (src[j] === '(') {
    const cp = matchParen(src, j);
    if (cp < 0) return null;
    const dest = parseDest(src.slice(j + 1, cp));
    if (dest === null) return null;
    url = dest.url; title = dest.title;
    j = cp + 1;
  } else if (src[j] === '[') {
    const rc = src.indexOf(']', j + 1);
    if (rc < 0) return null;
    let label = src.slice(j + 1, rc).trim();
    if (!label) label = text;
    const def = refs[refKey(label)];
    if (!def) return null;
    url = def.url; title = def.title;
    j = rc + 1;
  } else {
    // shortcut reference [text]
    const def = refs[refKey(text)];
    if (!def) return null;
    url = def.url; title = def.title;
  }

  // Honor the caller's opt-in: data: URLs are allowed only for images AND only when the caller
  // passes opts.allowImage (default off), matching this module's documented contract (#1014-F).
  const safe = sanitizeUrl(url, { allowImage: isImage && opts.allowImage === true });
  const titleAttr = title ? ' title="' + escapeAttrForMarkdown(title) + '"' : '';
  let html;
  if (isImage) {
    html = '<img src="' + escapeAttrForMarkdown(safe) + '" alt="' + escapeAttrForMarkdown(text) + '"' + titleAttr + '>';
  } else {
    html = '<a href="' + escapeAttrForMarkdown(safe) + '"' + titleAttr + '>' + parseInline(text, refs, opts) + '</a>';
  }
  return { token: stash(html), end: j };
}

function applyEmphasis(s) {
  s = s.replace(/(\*\*\*|___)(?=\S)([\s\S]+?)(?<=\S)\1/g, '<strong><em>$2</em></strong>');
  s = s.replace(/\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(?<![\w])__(?=\S)([\s\S]+?)(?<=\S)__(?![\w])/g, '<strong>$1</strong>');
  s = s.replace(/\*(?=\S)([\s\S]+?)(?<=\S)\*/g, '<em>$1</em>');
  s = s.replace(/(?<![\w])_(?=\S)([\s\S]+?)(?<=\S)_(?![\w])/g, '<em>$1</em>');
  s = s.replace(/~~(?=\S)([\s\S]+?)(?<=\S)~~/g, '<del>$1</del>');
  return s;
}

// =====================================================================
// Block parser
// =====================================================================

function parseBlocks(lines, refs, opts) {
  refs = refs || {};
  opts = opts || {};
  let out = '';
  let i = 0;
  const n = lines.length;

  while (i < n) {
    const line = lines[i];

    if (isBlank(line)) { i++; continue; }

    // fenced code block
    const fm = line.match(/^( {0,3})(`{3,}|~{3,})[ \t]*([^\n`]*)$/);
    if (fm) {
      const indent = fm[1].length;
      const fenceChar = fm[2][0];
      const fenceLen = fm[2].length;
      const lang = (fm[3] || '').trim().split(/\s+/)[0] || '';
      i++;
      const buf = [];
      while (i < n) {
        const cm = lines[i].match(/^ {0,3}(`{3,}|~{3,})[ \t]*$/);
        if (cm && cm[1][0] === fenceChar && cm[1].length >= fenceLen) { i++; break; }
        buf.push(lines[i].replace(new RegExp('^ {0,' + indent + '}'), ''));
        i++;
      }
      const cls = lang ? ' class="language-' + escapeAttrForMarkdown(lang) + '"' : '';
      out += '<pre><code' + cls + '>' + escapeHtmlForMarkdown(buf.join('\n')) + '\n</code></pre>\n';
      continue;
    }

    // ATX heading
    const hm = line.match(/^ {0,3}(#{1,6})(?:[ \t]+([\s\S]*?))?(?:[ \t]+#+)?[ \t]*$/);
    if (hm && (hm[2] !== undefined || /^ {0,3}#{1,6}[ \t]*$/.test(line))) {
      const level = hm[1].length;
      const txt = (hm[2] || '').trim();
      out += '<h' + level + '>' + parseInline(txt, refs, opts) + '</h' + level + '>\n';
      i++;
      continue;
    }

    // thematic break
    if (isHr(line)) { out += '<hr>\n'; i++; continue; }

    // blockquote
    if (isBlockquote(line)) {
      const inner = [];
      while (i < n) {
        const l = lines[i];
        if (isBlockquote(l)) { inner.push(l.replace(/^ {0,3}> ?/, '')); i++; continue; }
        if (!isBlank(l) && inner.length && !isBlockStart(lines, i)) { inner.push(l); i++; continue; }
        break;
      }
      out += '<blockquote>\n' + parseBlocks(inner, refs, opts) + '</blockquote>\n';
      continue;
    }

    // list
    if (matchListItem(line)) {
      const r = parseList(lines, i, refs, opts);
      out += r.html;
      i = r.end;
      continue;
    }

    // pipe table
    if (line.includes('|') && i + 1 < n && isTableDelimiterRow(lines[i + 1])) {
      const r = parseTable(lines, i, refs, opts);
      if (r) { out += r.html; i = r.end; continue; }
    }

    // indented code block
    if (/^ {4,}\S/.test(line)) {
      const buf = [];
      while (i < n) {
        if (/^ {4,}/.test(lines[i]) && !isBlank(lines[i])) { buf.push(lines[i].slice(4)); i++; continue; }
        if (isBlank(lines[i])) {
          let j = i;
          while (j < n && isBlank(lines[j])) j++;
          if (j < n && /^ {4,}\S/.test(lines[j])) { while (i < j) { buf.push(''); i++; } continue; }
        }
        break;
      }
      while (buf.length && buf[buf.length - 1] === '') buf.pop();
      out += '<pre><code>' + escapeHtmlForMarkdown(buf.join('\n')) + '\n</code></pre>\n';
      continue;
    }

    // paragraph (with setext heading detection)
    const para = [line];
    i++;
    let heading = 0;
    while (i < n) {
      const l = lines[i];
      if (isBlank(l)) break;
      if (para.length) {
        if (/^ {0,3}=+[ \t]*$/.test(l)) { heading = 1; i++; break; }
        if (/^ {0,3}-+[ \t]*$/.test(l)) { heading = 2; i++; break; }
      }
      if (isBlockStart(lines, i)) break;
      para.push(l);
      i++;
    }
    const content = parseInline(para.join('\n'), refs, opts);
    if (heading) out += '<h' + heading + '>' + content + '</h' + heading + '>\n';
    else out += '<p>' + content + '</p>\n';
  }

  return out;
}

function parseList(lines, start, refs, opts) {
  opts = opts || {};
  const n = lines.length;
  const base = matchListItem(lines[start]);
  const ordered = base.ordered;
  const firstMarker = base.marker;
  const firstDelim = base.delimiter;
  const startNum = base.startNum;
  const items = [];
  let loose = false;
  let i = start;

  while (i < n) {
    const m = matchListItem(lines[i]);
    if (!m) break;
    if (m.ordered !== ordered) break;
    if (!ordered && m.marker !== firstMarker) break;
    if (ordered && m.delimiter !== firstDelim) break;

    const contentIndent = m.contentIndent;
    const itemLines = [m.content];
    i++;
    let pendingBlank = false;
    while (i < n) {
      const l = lines[i];
      if (isBlank(l)) { pendingBlank = true; itemLines.push(''); i++; continue; }
      const indent = leadingSpaces(l);
      if (indent >= contentIndent) {
        if (pendingBlank) loose = true;
        pendingBlank = false;
        itemLines.push(l.slice(contentIndent));
        i++;
        continue;
      }
      if (matchListItem(l)) break; // next sibling / new item
      if (!pendingBlank) { itemLines.push(l); i++; continue; } // lazy paragraph continuation
      break;
    }
    // blank line between this item and the next sibling => loose list
    if (pendingBlank && i < n && matchListItem(lines[i])) loose = true;
    while (itemLines.length && itemLines[itemLines.length - 1] === '') itemLines.pop();
    items.push(itemLines);
  }

  let html = ordered
    ? '<ol' + (startNum !== 1 ? ' start="' + startNum + '"' : '') + '>\n'
    : '<ul>\n';
  let hasTask = false;

  for (const itemLines of items) {
    let taskChecked = null;
    const firstIdx = itemLines.findIndex((l) => l !== '');
    if (firstIdx >= 0) {
      const tm = itemLines[firstIdx].match(/^\[([ xX])\][ \t]+([\s\S]*)$/);
      if (tm) {
        taskChecked = tm[1].toLowerCase() === 'x';
        itemLines[firstIdx] = tm[2];
        hasTask = true;
      }
    }
    let inner = parseBlocks(itemLines, refs, opts);
    if (!loose) {
      // tight list: unwrap top-level single paragraphs
      inner = inner.replace(/<p>([\s\S]*?)<\/p>\n/g, '$1\n');
    }
    inner = inner.replace(/\n+$/, '');
    if (taskChecked !== null) {
      const box = '<input type="checkbox" disabled' + (taskChecked ? ' checked' : '') + '> ';
      html += '<li class="task-list-item">' + box + inner + '</li>\n';
    } else {
      html += '<li>' + (inner.includes('\n') ? '\n' + inner + '\n' : inner) + '</li>\n';
    }
  }

  html += ordered ? '</ol>\n' : '</ul>\n';
  if (hasTask) {
    html = html.replace(ordered ? '<ol' : '<ul',
      (ordered ? '<ol' : '<ul') + ' class="contains-task-list"');
  }
  return { html, end: i };
}

function parseTable(lines, start, refs, opts) {
  opts = opts || {};
  const n = lines.length;
  const header = splitTableRow(lines[start]);
  const aligns = splitTableRow(lines[start + 1]).map((cell) => {
    const c = cell.trim();
    const l = c.startsWith(':');
    const r = c.endsWith(':');
    return l && r ? 'center' : r ? 'right' : l ? 'left' : '';
  });
  let i = start + 2;
  const rows = [];
  while (i < n) {
    const l = lines[i];
    if (isBlank(l) || !l.includes('|') || isBlockStart(lines, i)) break;
    rows.push(splitTableRow(l));
    i++;
  }

  const cols = header.length;
  const styleFor = (idx) => (aligns[idx] ? ' style="text-align:' + aligns[idx] + '"' : '');

  let html = '<table>\n<thead>\n<tr>\n';
  for (let c = 0; c < cols; c++) {
    html += '<th' + styleFor(c) + '>' + parseInline(header[c] || '', refs, opts) + '</th>\n';
  }
  html += '</tr>\n</thead>\n<tbody>\n';
  for (const row of rows) {
    html += '<tr>\n';
    for (let c = 0; c < cols; c++) {
      html += '<td' + styleFor(c) + '>' + parseInline(row[c] || '', refs, opts) + '</td>\n';
    }
    html += '</tr>\n';
  }
  html += '</tbody>\n</table>\n';
  return { html, end: i };
}

// =====================================================================
// Preprocessing + top-level entry point
// =====================================================================

function expandLeadingTabs(line) {
  let out = '';
  let col = 0;
  let i = 0;
  while (i < line.length && (line[i] === ' ' || line[i] === '\t')) {
    if (line[i] === '\t') { const add = 4 - (col % 4); out += ' '.repeat(add); col += add; }
    else { out += ' '; col++; }
    i++;
  }
  return out + line.slice(i);
}

// Pull "[label]: url \"title\"" reference definitions out of the line
// stream; return the map plus the remaining lines.
function extractRefs(lines) {
  const refs = {};
  const kept = [];
  const re = /^ {0,3}\[([^\]]+)\]:[ \t]*(\S+)(?:[ \t]+(?:"([^"]*)"|'([^']*)'|\(([^)]*)\)))?[ \t]*$/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) {
      const key = refKey(m[1]);
      if (!(key in refs)) {
        refs[key] = { url: m[2].replace(/^<|>$/g, ''), title: m[3] ?? m[4] ?? m[5] ?? '' };
      }
      continue;
    }
    kept.push(line);
  }
  return { refs, lines: kept };
}

// Collapse runs of blank lines between blocks to a single newline, but NEVER inside a
// <pre>...</pre> region \u2014 code blocks preserve their interior blank lines verbatim (#1014-C).
function collapseBlankLinesOutsidePre(html) {
  // Odd-indexed parts are the captured <pre>...</pre> chunks (left untouched).
  return html
    .split(/(<pre[\s\S]*?<\/pre>)/)
    .map((part, idx) => (idx % 2 === 1 ? part : part.replace(/\n{2,}/g, '\n')))
    .join('');
}

function mdToHtml(src, opts) {
  opts = opts || {};
  const normalized = String(src ?? '').replace(/\uE000/g, '').replace(/\r\n?/g, '\n');
  const lines = normalized.split('\n').map(expandLeadingTabs);
  const { refs, lines: kept } = extractRefs(lines);
  const html = collapseBlankLinesOutsidePre(parseBlocks(kept, refs, opts)).trim();
  return html ? html + '\n' : '';
}

// ===== end jbcMarkdown (ES module) =====
// =====================================================================
// markdown-previewer — pure parser (DOM-free, exported, unit-testable).
//
// The safe Markdown -> HTML renderer (block + inline parser, URL sanitizer) now
// lives in the shared, Node-importable module src/lib/utils/formats/CtMarkdown.mjs (promoted
// to jason-code, vendored here). This file imports it and re-exports its API, and
// keeps the tool-specific SAMPLE_MARKDOWN cheat-sheet local. The unit tests load
// this module's namespace and the app inlines this file at build time, so the
// surface is unchanged; the build resolves the import and inlines the engine body
// (stripping each export) so the shipped index.html stays dependency-free. Raw
// HTML is always escaped and link/image URLs are sanitized (see DESIGN.md
// § "HTML safety / XSS stance").
// =====================================================================

// ---- Load-sample cheat-sheet (pure data) -----------------------------
const SAMPLE_MARKDOWN = [
  '# Markdown Previewer',
  '',
  'A **live** preview of _hand-rolled_ Markdown → HTML. Type on the left,',
  'see the rendered result on the right.',
  '',
  '## Text formatting',
  '',
  '**bold**, *italic*, ***bold italic***, ~~strikethrough~~, `inline code`,',
  'and a hard break at the end of this line.  ',
  'This text is on a new line.',
  '',
  '## Headings',
  '',
  '### H3',
  '#### H4',
  '',
  'Setext H2',
  '---',
  '',
  '## Lists',
  '',
  '- Unordered item',
  '- Another item',
  '  - Nested item',
  '  - Nested item two',
  '',
  '1. Ordered item',
  '2. Ordered item',
  '   1. Nested ordered',
  '',
  '### Task list',
  '',
  '- [x] Write the parser',
  '- [x] Style the preview',
  '- [ ] Ship it',
  '',
  '## Blockquotes',
  '',
  '> A quote.',
  '>',
  '> > A nested quote.',
  '',
  '## Code',
  '',
  '```js',
  'function greet(name) {',
  '  return `Hello, ${name}!`;',
  '}',
  '```',
  '',
  '## Links & images',
  '',
  '[A link](https://example.com "Example") and an autolink <https://example.com>.',
  '',
  'Reference-style: [claude-tools][repo].',
  '',
  '[repo]: https://github.com/codercowboy/claude-tools "claude-tools"',
  '',
  '## Table',
  '',
  '| Feature      | Supported | Notes            |',
  '| :----------- | :-------: | ---------------: |',
  '| Headings     |    yes    |     ATX + setext |',
  '| Tables       |    yes    | with alignment   |',
  '| Task lists   |    yes    |          GFM     |',
  '',
  '---',
  '',
  // NB: the closing tag below is written with an escaped slash so this inline
  // sample can't prematurely terminate the shipped page's script element; in
  // JS the string value is unaffected (backslash-slash is just a slash).
  'Raw HTML like `<script>alert(1)<\/script>` is escaped, not executed.',
  '',
].join('\n');


  // =====================================================================
  // 2. DOM references
  // =====================================================================
  const editorEl = document.getElementById('editor');
  const previewEl = document.getElementById('preview');
  const splitEl = document.querySelector('.split');
  const loadSampleBtn = document.getElementById('loadSampleBtn');
  const copyHtmlBtn = document.getElementById('copyHtmlBtn');
  const copyMdBtn = document.getElementById('copyMdBtn');
  const clearBtn = document.getElementById('clearBtn');
  const syncToggleBtn = document.getElementById('syncToggleBtn');
  const viewToggleBtn = document.getElementById('viewToggleBtn');

  const helpButtonEl = document.getElementById('help-button');

  // =====================================================================
  // 3. State & persistence — docs/conventions.md § "Persist UI state".
  // Versioned key holds the editor TEXT and the sync-scroll toggle only; the
  // rendered HTML is DERIVED (recomputed on load), never stored. Every
  // read/write is try/catch-wrapped and degrades silently.
  // =====================================================================
  const STORAGE_KEY = 'markdown-previewer:v1';
  const HELP_SEEN_KEY = 'markdown-previewer:help-seen:v1';

  // sideBySide === true → columns (default); false → stacked top/bottom.
  const state = { syncScroll: false, sideBySide: true };

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        text: editorEl.value,
        syncScroll: state.syncScroll,
        sideBySide: state.sideBySide,
      }));
    } catch (err) { /* best-effort — degrade to in-memory only */ }
  }

  function loadState() {
    const fallback = { text: '', syncScroll: false, sideBySide: true };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return {
        text: parsed && typeof parsed.text === 'string' ? parsed.text : '',
        syncScroll: !!(parsed && parsed.syncScroll),
        // Default to side-by-side when the stored value is absent (old blob).
        sideBySide: parsed && typeof parsed.sideBySide === 'boolean' ? parsed.sideBySide : true,
      };
    } catch (err) { return fallback; }
  }

  // =====================================================================
  // 4. Render — the one place preview.innerHTML is assigned, and only ever
  // the tool's OWN generated HTML (mdToHtml escapes all raw user HTML, see
  // logic.mjs / DESIGN.md § "HTML safety").
  // =====================================================================
  function render() {
    previewEl.innerHTML = mdToHtml(editorEl.value, { allowImage: true });
  }

  // In-field copy button reveals only when the editor is non-empty
  // (docs/conventions.md § "In-field copy button").
  function updateMdCopyVisibility() {
    copyMdBtn.hidden = editorEl.value === '';
  }

  // Shared trailing-edge debounce (CtUtil in the shared lib, inlined as a global).

  const debouncedRenderAndSave = debounce(() => { render(); saveState(); }, 120);
  editorEl.addEventListener('input', () => {
    updateMdCopyVisibility();     // immediate — don't float the icon over placeholder
    debouncedRenderAndSave();
  });

  // =====================================================================
  // 5. Toolbar
  // =====================================================================
  loadSampleBtn.addEventListener('click', () => {
    editorEl.value = SAMPLE_MARKDOWN;
    render();
    updateMdCopyVisibility();
    saveState();
    editorEl.focus();
    editorEl.setSelectionRange(0, 0);
    editorEl.scrollTop = 0;
  });

  copyHtmlBtn.addEventListener('click', async () => {
    const html = previewEl.innerHTML.trim();
    if (!html) return;
    const ok = await copy(html);
    if (ok) flash(copyHtmlBtn, { label: 'Copied!', revertTo: 'Copy HTML' });
  });

  // In-field copy of the raw Markdown source.
  copyMdBtn.addEventListener('click', async () => {
    if (editorEl.value === '') return;
    const ok = await copy(editorEl.value);
    if (ok) flash(copyMdBtn, { label: '✅', revertTo: '📋' });
  });

  clearBtn.addEventListener('click', async () => {
    if (editorEl.value === '') return;
    // Editor content can be a lot of hand-written Markdown — the "substantial /
    // hard-to-recreate" case the confirm convention protects.
    if (!(await confirmDialog('Clear the editor? This will discard the current Markdown.'))) return;
    editorEl.value = '';
    render();
    updateMdCopyVisibility();
    saveState();
    editorEl.focus();
  });

  function setSyncScroll(on) {
    state.syncScroll = !!on;
    syncToggleBtn.setAttribute('aria-pressed', String(state.syncScroll));
    syncToggleBtn.classList.toggle('active', state.syncScroll);
  }

  syncToggleBtn.addEventListener('click', () => {
    setSyncScroll(!state.syncScroll);
    saveState();
  });

  // View mode: pressed (default) = side-by-side columns; unpressed = stacked
  // top/bottom (editor smaller, preview taller). Same accented "selected" look
  // as the Sync scroll toggle (both carry class="toggle" + aria-pressed).
  function setSideBySide(on) {
    state.sideBySide = !!on;
    viewToggleBtn.setAttribute('aria-pressed', String(state.sideBySide));
    viewToggleBtn.classList.toggle('active', state.sideBySide);
    splitEl.classList.toggle('split--stacked', !state.sideBySide);
  }

  viewToggleBtn.addEventListener('click', () => {
    setSideBySide(!state.sideBySide);
    saveState();
  });

  // =====================================================================
  // 6. Scroll sync (optional) — proportional editor <-> preview mapping,
  // re-entrancy guarded so the programmatic scroll of one pane doesn't loop
  // back through the other's scroll handler.
  // =====================================================================
  let syncing = false;
  function mirrorScroll(from, to) {
    if (!state.syncScroll || syncing) return;
    const fromMax = from.scrollHeight - from.clientHeight;
    const toMax = to.scrollHeight - to.clientHeight;
    if (fromMax <= 0) return;
    syncing = true;
    to.scrollTop = (from.scrollTop / fromMax) * toMax;
    requestAnimationFrame(() => { syncing = false; });
  }
  editorEl.addEventListener('scroll', () => mirrorScroll(editorEl, previewEl));
  previewEl.addEventListener('scroll', () => mirrorScroll(previewEl, editorEl));

  // =====================================================================
  // 7. Help modal — the shared jbcModal primitive (src/lib/components/CtModal.mjs), built
  // from the hidden #help-body template. Focus-trap / Esc + backdrop close /
  // focus-return / reduced-motion / scroll-top live in that primitive; `autoOpen`
  // rides the shared onceFlag so it auto-shows once on a fresh visit.
  // =====================================================================
  const help = createModal({
    testid: 'help',
    titleId: 'help-title',
    title: 'How the Markdown Previewer works',
    body: document.getElementById('help-body').content.cloneNode(true),
    autoOpen: onceFlag(HELP_SEEN_KEY),
  });
  helpButtonEl.addEventListener('click', () => help.open());

  // =====================================================================
  // 8. Init — restore persisted text + toggle, render derived preview.
  // =====================================================================
  (function init() {
    const loaded = loadState();
    editorEl.value = loaded.text;
    setSyncScroll(loaded.syncScroll);
    setSideBySide(loaded.sideBySide);
    render();
    updateMdCopyVisibility();
    // The Help modal auto-shows once on a fresh visit via jbcModal's autoOpen.
  })();

  // =====================================================================
  // 9. Test hook — inert namespace for Playwright-driven tests.
  // =====================================================================
  window.__markdownPreviewer = {
    // pure functions
    mdToHtml,
    parseInline,
    escapeHtmlForMarkdown,
    sanitizeUrl,
    // deterministic entry point
    render,
    // live state
    state,
  };
</script>
