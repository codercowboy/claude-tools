<div class="app">
  <header class="app-header">
    <div class="app-header-row">
      <div class="header-titles">
        <h1>Format Converter</h1>
        <p class="subtitle">Convert between JSON, CSV, TSV, YAML, .properties, and XML — all local, nothing leaves your browser.</p>
      </div>
      <button
        id="help-button"
        type="button"
        class="help-button"
        data-testid="help-button"
        title="How it works"
        aria-label="How it works"
      >?</button>
    </div>
  </header>

  <!-- Formats + contextual options share one card. -->
  <section class="setup-card" data-testid="setup-card" aria-label="Conversion setup">
    <div class="format-bar">
      <div class="field">
        <label for="from-format">From</label>
        <select id="from-format" data-testid="from-format" class="format-select">
          <option value="auto">Auto-detect</option>
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="tsv">TSV</option>
          <option value="yaml">YAML</option>
          <option value="properties">.properties</option>
          <option value="xml">XML</option>
        </select>
      </div>
      <button type="button" class="swap-btn" id="swap-btn" data-testid="swap-btn" title="Swap source and target" aria-label="Swap source and target">&#8646;</button>
      <div class="field">
        <label for="to-format">To</label>
        <select id="to-format" data-testid="to-format" class="format-select">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="tsv">TSV</option>
          <option value="yaml">YAML</option>
          <option value="properties">.properties</option>
          <option value="xml">XML</option>
        </select>
      </div>
    </div>
    <p class="detect-status" data-testid="detect-status" role="status" aria-live="polite"></p>

    <div class="options-block" data-testid="options" aria-label="Conversion options">
      <p class="options-title">Options</p>
      <div class="options-groups">
        <!-- CSV / TSV -->
        <div class="opt-group" data-testid="opt-group-csv" hidden>
          <div class="field">
            <label for="opt-delimiter">Delimiter</label>
            <input type="text" id="opt-delimiter" data-testid="opt-delimiter" class="opt-narrow" value="," maxlength="4" autocomplete="off" spellcheck="false">
          </div>
          <label class="opt-inline">
            <input type="checkbox" id="opt-header" data-testid="opt-header" checked>
            <span>Header row</span>
          </label>
        </div>

        <!-- JSON / YAML indent -->
        <div class="opt-group" data-testid="opt-group-indent" hidden>
          <div class="field">
            <label for="opt-indent">Indent</label>
            <select id="opt-indent" data-testid="opt-indent" class="opt-select">
              <option value="0">Minified</option>
              <option value="2" selected>2 spaces</option>
              <option value="4">4 spaces</option>
            </select>
          </div>
        </div>

        <!-- XML -->
        <div class="opt-group" data-testid="opt-group-xml" hidden>
          <div class="field">
            <label for="opt-xml-root">Root element</label>
            <input type="text" id="opt-xml-root" data-testid="opt-xml-root" class="opt-narrow" value="root" autocomplete="off" spellcheck="false">
          </div>
          <label class="opt-inline">
            <input type="checkbox" id="opt-xml-attrs" data-testid="opt-xml-attrs">
            <span>Primitives as attributes</span>
          </label>
          <label class="opt-inline">
            <input type="checkbox" id="opt-xml-decl" data-testid="opt-xml-decl" checked>
            <span>XML declaration</span>
          </label>
        </div>

        <!-- .properties -->
        <div class="opt-group" data-testid="opt-group-properties" hidden>
          <label class="opt-inline">
            <input type="checkbox" id="opt-props-unicode" data-testid="opt-props-unicode">
            <span>Escape non-ASCII as \uXXXX</span>
          </label>
        </div>

        <p class="opt-empty" data-testid="opt-empty" hidden>No options for this conversion.</p>
      </div>
    </div>
  </section>

  <p class="error" data-testid="error" role="alert" aria-live="assertive" hidden></p>

  <div class="io-grid">
    <div class="io-col">
      <div class="io-head">
        <h2>Input</h2>
        <div class="io-actions">
          <button type="button" id="sample-btn" data-testid="sample-btn" title="Load a sample document" aria-label="Load a sample document">Sample</button>
          <button type="button" id="clear-btn" data-testid="clear-btn" title="Clear the input" aria-label="Clear the input">Clear</button>
        </div>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="input" data-testid="input" spellcheck="false" placeholder="Paste or type your document here..." aria-label="Input document"></textarea>
        <button type="button" class="ct-copy-btn" id="input-copy-btn" data-testid="input-copy-btn" title="Copy input" aria-label="Copy input" hidden>&#128203;</button>
      </div>
    </div>

    <div class="io-col">
      <div class="io-head">
        <h2>Output</h2>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="output" data-testid="output" readonly spellcheck="false" placeholder="Converted output appears here." aria-label="Converted output"></textarea>
        <button type="button" class="ct-copy-btn" id="copy-btn" data-testid="copy-btn" title="Copy output" aria-label="Copy output">&#128203;</button>
      </div>
    </div>
  </div>
</div>

<!-- Help modal is built at runtime by the shared jbcModal primitive
     (lib/modal.js) from this hidden template. The <h2> title is
     supplied via jbcModal's `title` option, so it is not repeated here. -->
<template id="help-body">
    <p>Convert a document between <strong>JSON</strong>, <strong>CSV</strong>, <strong>TSV</strong>, <strong>YAML</strong>, <strong>.properties</strong>, and <strong>XML</strong>. Everything runs locally in your browser — nothing you paste is ever sent anywhere.</p>
    <ul>
      <li><strong>Pick From &amp; To.</strong> Choose the source format (or <strong>Auto-detect</strong>) and the target format. The output updates live as you type. <strong>&#8646;</strong> swaps the two.</li>
      <li><strong>How nesting maps.</strong> JSON, YAML, and XML represent nested trees natively. <strong>CSV/TSV</strong> are tabular — they map to/from an <em>array of row objects</em> (first row = headers). <strong>.properties</strong> is flat — nested objects map to/from <em>dotted keys</em> (<code>a.b.c=…</code>), and arrays use numeric segments (<code>list.0=…</code>).</li>
      <li><strong>Options</strong> change to match the conversion: CSV/TSV <strong>delimiter</strong> and <strong>header row</strong>; JSON/YAML <strong>indent</strong>; XML <strong>root element</strong>, an attributes-vs-child-elements strategy, and a declaration toggle; and <strong>.properties</strong> unicode escaping.</li>
      <li><strong>YAML support</strong> is a practical common subset (block maps/sequences, flow <code>[…]</code>/<code>{…}</code>, quoted &amp; typed scalars, <code>|</code>/<code>&gt;</code> block scalars, comments). Advanced YAML — anchors, aliases, tags, merge keys, multiple documents — is refused with a clear message rather than mis-parsed.</li>
      <li><strong>Errors.</strong> Invalid input or an impossible mapping (e.g. a nested object into a single CSV table) shows a friendly message instead of crashing.</li>
      <li><strong>Copy</strong> puts the output on your clipboard.</li>
    </ul>
    <p class="help-note">Your input, format choices, and options are remembered on this device, so reopening the tool picks up where you left off.</p>
</template>

 * slugify / wrapText modules, absorbed here — jbc ES6 modularization · Train 37 · R12).
 * ---------------------------------------------------------------------------
 *     import { onceFlag, downloadBlob, debounce } from '<rel>/jbc-include/CtUtil.mjs';
 *     // (or `CtUtil.onceFlag` etc. via the aggregator class at the bottom — the
 *     //  statics REFERENCE the named bindings, single implementation.)
 *
 * Bodies are moved VERBATIM from util.js (and posAt.mjs / slugify.mjs / wrapText.mjs);
 * only the access path changed (the old util.js global's `X` -> named import `X`). SELF-CONTAINED: no
 * imports (so flattening never drags another module's top-level names into a page).
 * Where each former util.js helper went:
 *   - getRandomBytes + makeId      -> CtByteUtil.mjs (makeId rides with getRandomBytes so
 *                                      this module needs no import of CtByteUtil)
 *   - showWarning / hideError / hideWarning / showBanner / hideBanner
 *                                  -> components/CtComponents.mjs (next to showError)
 *   - iconButton / wireTabs / ... / announce  -> components/CtComponents.mjs (R11)
 *   - loadImageFile / canvasToBlob / canvasToPngBytes -> image/CtImageUtil.mjs
 *
 * These are the browser/DOM-facing idioms every tool re-rolled by hand. Most touch
 * runtime-only surfaces (document / URL / localStorage / setTimeout) but only inside
 * function bodies, so the module is safe to import from Node (the pure helpers —
 * clamp/num/escape*, posAt/slugify/wrapText — are usable in a unit-tested logic.mjs).
 *
 * downloadBlob(data, filename, mime?):
 * - Triggers a file download. `data` may be a Blob, a string, or a Uint8Array
 *   (anything the Blob constructor accepts). A Blob is used as-is; anything
 *   else is wrapped in a Blob (with `mime` as its type when given).
 * - Creates an object URL, clicks a temporary hidden <a download>, then revokes
 *   the URL on a short timeout so the download has time to start.
 *
 * debounce(fn, ms):
 * - Returns a trailing-edge debounced wrapper: repeated calls reset the timer,
 *   and `fn` runs once, `ms` after the last call, with the latest args and `this`.
 *
 * (formatBytes is NOT here: the single formatBytes(bytes, opts) lives in CtByteUtil.mjs. The old
 *   compact util.js variant — no space, lowercase "b", 2 decimals — was removed; callers use
 *   CtByteUtil.formatBytes, which prints "1.5 KB" style.)
 *
 * clamp(n, lo, hi):  Coerces `n` to a number and clamps it to [lo, hi]. Non-finite -> `lo`.
 * num(v, fallback?): Coerces `v` to a finite number, else `fallback` (default 0).
 * clampInt(v, lo, hi, fallback): parseInt(v, 10) then clamps to [lo, hi]; non-integer -> `fallback`.
 *
 * escapeHtml(s): Escapes & < > (safe for a text node; quotes left as-is).
 * escapeAttr(s): escapeHtml plus " -> &quot; and ' -> &#39; (for attribute values).
 * (escapeXml is NOT here: the canonical escapeXml(text, strict?) lives in formats/CtEscaper.mjs.
 *   The old util.js escapeXml / escapeXmlBasic was folded into it.)
 *
 * persistState(key, defaults):
 * - Versioned, best-effort localStorage persistence driven by a `defaults` shape.
 *   Put a version in the key (e.g. "mytool:v1"). Returns { load, save }. `load()`
 *   overlays stored values on the defaults, coercing by the default's TYPE and
 *   dropping non-finite numbers; `save(state)` stores ONLY the keys in `defaults`.
 *   All access is try/catch-guarded (private mode / disabled storage degrade silently).
 *
 * onceFlag(key):
 * - A one-shot "have they seen this?" flag on `key`. Returns { seen, mark }.
 *   `seen()` is true once `mark()` has run; a storage throw is treated as
 *   already-seen (never re-nag). Used for first-load help auto-open.
 *
 * el(tag, props?, children?):
 * - Hyperscript element factory. `props` keys: `class`/`className`, `text`/
 *   `textContent`, `html`/`innerHTML`, any `data-*`/`aria-*` + `role`/`title`/
 *   `for`/`type`/`value`/`name`/`href`/`id`/`placeholder` (set as attributes),
 *   everything else assigned as a property; null/undefined values are skipped.
 *   `children` is a node, a string/number (-> text node), or an array of those;
 *   null/false entries are skipped.
 *
 * prefersReducedMotion(): True when the user asked for reduced motion (false if unavailable).
 * restartAnimation(el, cls): remove `cls`, force reflow (`void el.offsetWidth`), re-add `cls`.
 *
 * setupHiDPICanvas(canvas, opts?):
 * - Sizes a canvas' backing store for crisp rendering on high-DPR displays. CSS
 *   size is opts.width/opts.height (CSS px) or the canvas' current
 *   clientWidth/clientHeight. dpr = devicePixelRatio (capped at opts.maxDpr when
 *   given). Sets canvas.width/height = round(css * dpr); sets the CSS pixel size
 *   via style unless opts.style===false; gets the 2d context (unless
 *   opts.context===false) and applies setTransform(dpr,0,0,dpr,0,0) unless
 *   opts.transform===false. Returns { dpr, cssW, cssH, ctx }.
 *
 * posAt(text, index) / slugify(str, opts?) / wrapText(text, maxWidth, measure):
 * - Pure text helpers (ex posAt.mjs / slugify.mjs / wrapText.mjs); full doc blocks
 *   at their sections below.
 *
 * This is a shared component inlined by the build (import-inlining; no globals).
 * Edit the canonical copy, re-vendor, run `npm run build`. Canonical source:
 * html-single-file/assets/CtUtil.mjs
 */

// =====================================================================
// Section: downloadBlob / debounce / clamp / num / clampInt
// =====================================================================
function downloadBlob(data, filename, mime) {
  var blob = (data instanceof Blob)
    ? data
    : new Blob([data], mime ? { type: mime } : undefined);
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename == null ? '' : String(filename);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function debounce(fn, ms) {
  var t;
  return function () {
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(self, args); }, ms);
  };
}

function clamp(n, lo, hi) {
  var v = Number(n);
  // NaN has no position on the number line → lo. ±Infinity DO: +Infinity clamps to hi,
  // -Infinity to lo via the normal comparison below (#1014-O).
  if (Number.isNaN(v)) return lo;
  return v < lo ? lo : (v > hi ? hi : v);
}

function num(v, fallback) {
  var n = Number(v);
  return Number.isFinite(n) ? n : (fallback === undefined ? 0 : fallback);
}

function clampInt(v, lo, hi, fallback) {
  var n = parseInt(v, 10);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(lo, Math.min(hi, n));
}

// =====================================================================
// Section: escapeHtml / escapeAttr  (escapeXml lives in CtEscaper)
// =====================================================================
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeAttr(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// =====================================================================
// Section: persistState / onceFlag
// =====================================================================
function persistState(key, defaults) {
  function load() {
    var out = {};
    for (var k in defaults) {
      if (Object.prototype.hasOwnProperty.call(defaults, k)) out[k] = defaults[k];
    }
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return out;
      var p = JSON.parse(raw);
      if (!p || typeof p !== 'object') return out;
      for (var k2 in defaults) {
        if (!Object.prototype.hasOwnProperty.call(defaults, k2)) continue;
        if (p[k2] === undefined) continue;
        var d = defaults[k2];
        if (typeof d === 'boolean') out[k2] = !!p[k2];
        else if (typeof d === 'number') { var nn = Number(p[k2]); if (Number.isFinite(nn)) out[k2] = nn; }
        else out[k2] = String(p[k2]);
      }
    } catch (e) { /* ignore malformed / disabled storage */ }
    return out;
  }
  function save(state) {
    var toStore = {};
    for (var k in defaults) {
      if (!Object.prototype.hasOwnProperty.call(defaults, k)) continue;
      if (state && state[k] !== undefined) toStore[k] = state[k];
    }
    try { localStorage.setItem(key, JSON.stringify(toStore)); } catch (e) { /* best-effort */ }
  }
  return { load: load, save: save };
}

function onceFlag(key) {
  return {
    seen: function () { try { return localStorage.getItem(key) === '1'; } catch (e) { return true; } },
    mark: function () { try { localStorage.setItem(key, '1'); } catch (e) { /* best-effort */ } }
  };
}

// =====================================================================
// Section: el (hyperscript factory)
// =====================================================================
var ATTR_KEYS = { role: 1, title: 1, 'for': 1, type: 1, value: 1, name: 1, href: 1, id: 1, placeholder: 1 };
function el(tag, props, children) {
  var node = document.createElement(tag);
  if (props) {
    for (var k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
      var v = props[k];
      if (v == null) continue;
      if (k === 'class' || k === 'className') node.className = v;
      else if (k === 'text' || k === 'textContent') node.textContent = v;
      else if (k === 'html' || k === 'innerHTML') node.innerHTML = v;
      else if (k.indexOf('data-') === 0 || k.indexOf('aria-') === 0 || ATTR_KEYS[k]) node.setAttribute(k, v);
      else node[k] = v;
    }
  }
  var kids = (children == null) ? [] : (Array.isArray(children) ? children : [children]);
  for (var i = 0; i < kids.length; i++) {
    var c = kids[i];
    if (c == null || c === false) continue;
    node.appendChild((typeof c === 'string' || typeof c === 'number') ? document.createTextNode(String(c)) : c);
  }
  return node;
}

// =====================================================================
// Section: prefersReducedMotion / restartAnimation / setupHiDPICanvas
// =====================================================================
function prefersReducedMotion() {
  try {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { return false; }
}

function restartAnimation(elm, cls) {
  if (!elm) return;
  if (cls) elm.classList.remove(cls);
  void elm.offsetWidth;
  if (cls) elm.classList.add(cls);
}

function setupHiDPICanvas(canvas, opts) {
  opts = opts || {};
  var cssW = (opts.width != null) ? opts.width : (canvas.clientWidth || 0);
  var cssH = (opts.height != null) ? opts.height : (canvas.clientHeight || 0);
  var dpr = window.devicePixelRatio || 1;
  if (opts.maxDpr != null) dpr = Math.min(dpr, opts.maxDpr);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  if (opts.style !== false) {
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }
  var ctx = (opts.context === false) ? null : canvas.getContext('2d');
  if (ctx && opts.transform !== false) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { dpr: dpr, cssW: cssW, cssH: cssH, ctx: ctx };
}

// =====================================================================
// Section: posAt  (was posAt.mjs — jbcPosAt)
// =====================================================================
/*
 * posAt(text, index) -> { line, column }
 * ---------------------------------------------------------------------------
 * Map a 0-based character offset into `text` to a 1-based { line, column }
 * position — the readout a parser wants when reporting where an error occurred.
 * Lines are split on `\n`; `column` counts characters from the line start
 * (1-based). `index` is clamped to `text.length`, so an offset at or past the
 * end returns the position just after the final character. Every other character
 * (including `\r` and `\t`) advances the column by one.
 *
 * Node-importable ES module. A tool whose pure, unit-tested source/logic.mjs
 * needs offset->line/column imports this module directly (so `node --test` can
 * load it); the single-file build inlines this module body into the shipped
 * index.html — stripping the `export` — so the shipped tool stays
 * dependency-free and file://-openable. See the consuming repo's build docs
 * (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function posAt(text, index) {
  let line = 1;
  let col = 1;
  const end = Math.min(index, text.length);
  for (let i = 0; i < end; i++) {
    if (text[i] === '\n') { line++; col = 1; } else { col++; }
  }
  return { line, column: col };
}

// =====================================================================
// Section: slugify  (was slugify.mjs — jbcSlugify)
// =====================================================================
/*
 * slugify(str, opts?) -> string
 * ---------------------------------------------------------------------------
 * Turn arbitrary text into a filename-safe ASCII slug: trim, lowercase, drop
 * straight/curly-free quotes, collapse every run of non-alphanumeric characters
 * to a single hyphen, strip leading/trailing hyphens, and cap the result at 60
 * characters. `null`/`undefined` become `''`. This is the conservative, ASCII
 * form used for download filenames (e.g. "My Card!" -> "my-card").
 *
 * With NO options this is exactly the historical ASCII slugifier, so an
 * option-free call is byte-identical to the pre-parameterization function.
 *
 * DIACRITIC-AWARE VARIANT — `slugify(str, { diacritics: true, cap? })`. Some
 * tools need "Café Menu" -> "cafe-menu" (the default ASCII form drops the
 * accented letters). Passing `diacritics: true` selects a different pipeline
 * that (1) NFKD-normalizes and strips combining diacritical marks (U+0300–U+036F)
 * so "é" -> "e", then (2) splits into words with a camelCase / acronym / digit-
 * run-aware splitter (the text-toolkit word model: "fooBar" -> foo, Bar;
 * "HTMLParser" -> HTML, Parser; "foo2bar" -> foo, 2, bar), lowercases each, and
 * joins with '-'. This is NOT the same word model as the default (which collapses
 * every non-alphanumeric run) — it is the diacritic slug several text tools rolled
 * by hand. `opts.cap` (a number) caps the length; omitted / null leaves it
 * UNCAPPED (text-toolkit's slug is uncapped).
 *
 * Node-importable ES module. A tool whose pure, unit-tested source/logic.mjs
 * needs a slug imports this module directly (so `node --test` can load it); the
 * single-file build inlines this module body into the shipped index.html —
 * stripping the `export` — so the shipped tool stays dependency-free and
 * file://-openable. See the consuming repo's build docs (§ "Build-assembled
 * tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function slugify(str, opts) {
  opts = opts || {};
  if (opts.diacritics) {
    if (str == null) return '';
    const stripped = String(str).normalize('NFKD').replace(/[̀-ͯ]/g, '');
    const words = stripped.match(/[A-Z]+(?=[A-Z][a-z])|[A-Z][a-z]+|[A-Z]+|[a-z]+|[0-9]+/g) || [];
    const slug = words.map((w) => w.toLowerCase()).join('-');
    // Strip a trailing hyphen the cap may have left mid-separator (#1014-O).
    return opts.cap == null ? slug : slug.slice(0, opts.cap).replace(/-+$/g, '');
  }
  return String(str == null ? '' : str)
    .trim()
    .toLowerCase()
    .replace(/['"]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60)
    .replace(/-+$/g, ''); // the 60-char cap can land mid-separator, re-stripping a trailing hyphen (#1014-O)
}

// =====================================================================
// Section: wrapText  (was wrapText.mjs — jbcWrapText)
// =====================================================================
/*
 * wrapText(text, maxWidth, measure) -> string[]
 * ---------------------------------------------------------------------------
 * Greedy word-wrap of `text` to a maximum width, returning an array of lines
 * (always at least one, possibly `''`). Explicit newlines are honored as hard
 * breaks first; within a paragraph, words are packed greedily and a single word
 * wider than `maxWidth` is kept whole on its own line (never dropped or split).
 *
 * Width is measured by the injected `measure(str) -> number` callback — the
 * pure wrapping logic lives here; the canvas/DOM text-measurement stays at the
 * call site (pass `ctx.measureText(s).width`). `maxWidth` is coerced to a finite
 * number (non-finite -> 0); a limit of 0 (or less) disables width-wrapping, so
 * only explicit newlines break the text and `measure` is never called.
 *
 * Node-importable ES module. A tool whose pure, unit-tested source/logic.mjs
 * wraps text imports this module directly (so `node --test` can load it, feeding
 * a deterministic `measure`); the single-file build inlines this module body
 * into the shipped index.html — stripping the `export` — so the shipped tool
 * stays dependency-free and file://-openable. See the consuming repo's build
 * docs (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function wrapText(text, maxWidth, measure) {
  const src = text == null ? '' : String(text);
  const mw = Number(maxWidth);
  const limit = Number.isFinite(mw) ? mw : 0;
  const paras = src.split('\n');
  const out = [];
  for (const para of paras) {
    const words = para.split(/(\s+)/).filter((t) => t.length > 0);
    if (words.length === 0) { out.push(''); continue; }
    let line = '';
    for (const token of words) {
      const isSpace = /^\s+$/.test(token);
      const candidate = line + token;
      if (line === '') {
        line = isSpace ? '' : token;
        continue;
      }
      if (limit > 0 && measure(candidate) > limit && !isSpace) {
        out.push(line.replace(/\s+$/, ''));
        line = token;
      } else {
        line = candidate;
      }
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out.length ? out : [''];
}

class CtUtil {

  static num = num;

  static escapeAttr = escapeAttr;

  static prefersReducedMotion = prefersReducedMotion;
  static restartAnimation = restartAnimation;
  static setupHiDPICanvas = setupHiDPICanvas;

  static slugify = slugify;

}

// ===== Begin jbcFormat (ES module) =====
/*
 * jbcFormat — structured-data format conversion engine
 * (JSON / CSV / TSV / YAML / .properties / XML).
 * ---------------------------------------------------------------------------
 * A DOM-free, Node-importable ES module. Each supported format has a
 * parse<Source>(text, opts) -> plain JS value (objects, arrays, strings,
 * numbers, booleans, null) and an emit<Target>(model, opts) -> text; a small
 * PARSERS/EMITTERS registry plus convert(text, from, to, opts) drive the
 * round-trips, and detectFormat(text) auto-detects the source format. YAML and
 * XML use practical hand-written parsers/emitters (a documented subset), so the
 * module carries no runtime dependency. FORMATS is the format registry
 * (id + label) a consuming UI can build its selects from.
 *
 * A tool whose pure, unit-tested source/logic.mjs needs format conversion
 * imports this module directly (so `node --test` can load it); the single-file
 * build inlines this module body into the shipped index.html — stripping each
 * `export` — so the shipped tool stays dependency-free and file://-openable.
 * See the consuming repo's build docs (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build.
 */

// Format metadata for the UI selects.
const FORMATS = [
  { id: 'json', label: 'JSON' },
  { id: 'csv', label: 'CSV' },
  { id: 'tsv', label: 'TSV' },
  { id: 'yaml', label: 'YAML' },
  { id: 'properties', label: '.properties' },
  { id: 'xml', label: 'XML' },
];

// ---------------------------------------------------------------------
// Shared helpers
// ---------------------------------------------------------------------
function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function convertError(msg) {
  return new Error(msg);
}

// Flatten a nested model into [dottedKey, primitiveValue] pairs.
function flattenPairs(value, prefix, out) {
  if (Array.isArray(value)) {
    if (value.length === 0) {
      if (prefix !== '') out.push([prefix, '']);
      return out;
    }
    value.forEach((item, i) => {
      const key = prefix === '' ? String(i) : `${prefix}.${i}`;
      flattenPairs(item, key, out);
    });
  } else if (isPlainObject(value)) {
    const keys = Object.keys(value);
    if (keys.length === 0) {
      if (prefix !== '') out.push([prefix, '']);
      return out;
    }
    for (const k of keys) {
      const key = prefix === '' ? k : `${prefix}.${k}`;
      flattenPairs(value[k], key, out);
    }
  } else {
    out.push([prefix === '' ? '_' : prefix, scalarToString(value)]);
  }
  return out;
}

function scalarToString(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'string') return v;
  return String(v);
}

// Un-flatten dotted-key pairs into a nested object/array model.
function unflattenPairs(pairs) {
  const root = {};
  for (const [key, value] of pairs) {
    const segments = key.split('.');
    let node = root;
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      const last = i === segments.length - 1;
      if (last) {
        node[seg] = value;
      } else {
        if (!isPlainObject(node[seg])) node[seg] = {};
        node = node[seg];
      }
    }
  }
  return arraifyIntegerKeys(root);
}

// Recursively convert objects whose keys are exactly 0..n-1 into arrays.
function arraifyIntegerKeys(node) {
  if (!isPlainObject(node)) return node;
  const keys = Object.keys(node);
  for (const k of keys) node[k] = arraifyIntegerKeys(node[k]);
  if (keys.length === 0) return node;
  const allInts = keys.every((k) => /^(0|[1-9]\d*)$/.test(k));
  if (allInts) {
    const nums = keys.map(Number).sort((a, b) => a - b);
    if (nums[0] === 0 && nums[nums.length - 1] === nums.length - 1) {
      const arr = [];
      for (const n of nums) arr[n] = node[String(n)];
      return arr;
    }
  }
  return node;
}

// ---------------------------------------------------------------------
// JSON
// ---------------------------------------------------------------------
function parseJSON(text) {
  try {
    return JSON.parse(text);
  } catch (err) {
    throw convertError(`Invalid JSON: ${err.message}`);
  }
}

function emitJSON(model, opts = {}) {
  const indent = normalizeIndent(opts.indent, 2);
  try {
    return JSON.stringify(model, null, indent);
  } catch (err) {
    throw convertError(`Could not emit JSON: ${err.message}`);
  }
}

function normalizeIndent(value, fallback) {
  const n = Number(value);
  if (Number.isFinite(n) && n >= 0 && n <= 8) return Math.floor(n);
  return fallback;
}

// ---------------------------------------------------------------------
// CSV / TSV  (tabular <-> array of row objects)
// ---------------------------------------------------------------------
// RFC-4180-ish parser: quoted fields with embedded delimiter/newline/quote.
function parseDelimited(text, delimiter) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let started = false; // any char seen on the current record
  let quoted = false;  // current record contained a quote char (so an empty field is explicit)
  const rowsQuoted = []; // per-row: did it contain a quote?
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    started = true;
    if (inQuotes) {
      if (ch === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true; quoted = true;
    } else if (ch === delimiter) {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); rowsQuoted.push(quoted); row = [];
      started = false; quoted = false;
    } else {
      field += ch;
    }
  }
  if (inQuotes) throw convertError('Unterminated quoted field in delimited input.');
  if (started || field !== '' || row.length > 0) {
    row.push(field);
    rows.push(row); rowsQuoted.push(quoted);
  }
  // Drop a single trailing empty record that came from the file's final newline — but NOT one whose
  // lone field was an explicit quoted empty (`""`), which is a real single-column empty value (#1014-J).
  const last = rows.length - 1;
  if (last >= 0 && rows[last].length === 1 && rows[last][0] === '' && !rowsQuoted[last]) {
    rows.pop();
  }
  return rows;
}

function parseCSV(text, opts = {}) {
  const delimiter = typeof opts.delimiter === 'string' && opts.delimiter.length
    ? opts.delimiter : ',';
  const header = opts.header !== false;
  const rows = parseDelimited(text, delimiter);
  if (rows.length === 0) return [];
  if (!header) return rows;
  const headers = rows[0];
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      obj[headers[c]] = rows[r][c] !== undefined ? rows[r][c] : '';
    }
    out.push(obj);
  }
  return out;
}

function parseTSV(text, opts = {}) {
  return parseCSV(text, { ...opts, delimiter: '\t' });
}

function needsQuoting(value, delimiter) {
  return value.includes(delimiter) || value.includes('"') ||
    value.includes('\n') || value.includes('\r');
}

function csvCell(value, delimiter) {
  let s;
  if (value === null || value === undefined) s = '';
  else if (typeof value === 'object') s = JSON.stringify(value);
  else s = String(value);
  if (needsQuoting(s, delimiter)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// Join already-formatted cells for one record. A record that is a single empty cell is emitted as
// `""` so it survives the round-trip — an unquoted empty line parses as a dropped blank row (#1014-J).
function joinRow(cells, delimiter) {
  if (cells.length === 1 && cells[0] === '') return '""';
  return cells.join(delimiter);
}

function emitCSV(model, opts = {}) {
  const delimiter = typeof opts.delimiter === 'string' && opts.delimiter.length
    ? opts.delimiter : ',';
  const header = opts.header !== false;

  // Normalize the model into a list of rows.
  let records = model;
  if (isPlainObject(model)) records = [model];
  if (!Array.isArray(records)) {
    throw convertError('CSV/TSV output needs a tabular model: an array of rows (records), not a single value.');
  }
  if (records.length === 0) return '';

  // Array of arrays -> emit as-is (optionally with the first row as header).
  if (records.every((r) => Array.isArray(r))) {
    return records.map((r) => joinRow(r.map((c) => csvCell(c, delimiter)), delimiter)).join('\n');
  }

  // Array of primitives -> single "value" column.
  if (records.every((r) => r === null || typeof r !== 'object')) {
    const lines = [];
    if (header) lines.push(joinRow([csvCell('value', delimiter)], delimiter));
    for (const r of records) lines.push(joinRow([csvCell(r, delimiter)], delimiter));
    return lines.join('\n');
  }

  // Array of objects -> columns = union of keys in first-seen order.
  if (!records.every((r) => isPlainObject(r))) {
    throw convertError('CSV/TSV output needs uniform records: an array of objects (or of arrays, or of primitives).');
  }
  const columns = [];
  const seen = new Set();
  for (const rec of records) {
    for (const k of Object.keys(rec)) {
      if (!seen.has(k)) { seen.add(k); columns.push(k); }
    }
  }
  const lines = [];
  if (header) lines.push(joinRow(columns.map((c) => csvCell(c, delimiter)), delimiter));
  for (const rec of records) {
    lines.push(joinRow(columns.map((c) => csvCell(rec[c], delimiter)), delimiter));
  }
  return lines.join('\n');
}

function emitTSV(model, opts = {}) {
  return emitCSV(model, { ...opts, delimiter: '\t' });
}

// ---------------------------------------------------------------------
// .properties  (flat dotted keys <-> nested model)
// ---------------------------------------------------------------------
function parseProperties(text) {
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rawLines = src.split('\n');
  const logical = [];
  // Join continuation lines (odd number of trailing backslashes).
  let buffer = null;
  for (let line of rawLines) {
    let l = buffer !== null ? line.replace(/^\s+/, '') : line;
    if (buffer !== null) l = buffer + l, buffer = null;
    // Skip comments/blank only when not continuing.
    const trimmedStart = l.replace(/^\s+/, '');
    if (buffer === null && (trimmedStart === '' || trimmedStart[0] === '#' || trimmedStart[0] === '!')) {
      continue;
    }
    if (endsWithOddBackslash(l)) {
      buffer = l.replace(/\\$/, '');
      continue;
    }
    logical.push(l);
  }
  if (buffer !== null) logical.push(buffer);

  const pairs = [];
  for (const line of logical) {
    const trimmed = line.replace(/^\s+/, '');
    if (trimmed === '' || trimmed[0] === '#' || trimmed[0] === '!') continue;
    const { key, value } = splitPropertyLine(trimmed);
    pairs.push([unescapeProperties(key), unescapeProperties(value)]);
  }
  return unflattenPairs(pairs);
}

function endsWithOddBackslash(s) {
  let count = 0;
  for (let i = s.length - 1; i >= 0 && s[i] === '\\'; i--) count++;
  return count % 2 === 1;
}

function splitPropertyLine(line) {
  // Find first unescaped '=', ':', or whitespace as the key/value separator.
  let i = 0;
  let key = '';
  while (i < line.length) {
    const ch = line[i];
    if (ch === '\\') { key += ch + (line[i + 1] || ''); i += 2; continue; }
    if (ch === '=' || ch === ':') { i++; break; }
    if (ch === ' ' || ch === '\t' || ch === '\f') {
      // whitespace separator: consume trailing whitespace + optional =/:
      while (i < line.length && (line[i] === ' ' || line[i] === '\t' || line[i] === '\f')) i++;
      if (line[i] === '=' || line[i] === ':') {
        i++;
        while (i < line.length && (line[i] === ' ' || line[i] === '\t')) i++;
      }
      break;
    }
    key += ch; i++;
  }
  while (i < line.length && (line[i] === ' ' || line[i] === '\t')) i++;
  return { key: key.trim(), value: line.slice(i) };
}

function unescapeProperties(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch !== '\\') { out += ch; continue; }
    const next = s[i + 1];
    if (next === undefined) break;
    if (next === 'u') {
      const hex = s.slice(i + 2, i + 6);
      if (/^[0-9a-fA-F]{4}$/.test(hex)) {
        out += String.fromCharCode(parseInt(hex, 16));
        i += 5;
        continue;
      }
      out += 'u'; i += 1; continue;
    }
    const map = { n: '\n', t: '\t', r: '\r', f: '\f' };
    out += map[next] !== undefined ? map[next] : next;
    i += 1;
  }
  return out;
}

function escapePropertyKey(s) {
  let out = '';
  for (const ch of s) {
    if (ch === '\\' || ch === '=' || ch === ':' || ch === ' ' || ch === '\t') out += '\\' + ch;
    else out += escapeControl(ch);
  }
  return out;
}

function escapePropertyValue(s, escapeUnicode) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '\\') out += '\\\\';
    else if (ch === '\n') out += '\\n';
    else if (ch === '\t') out += '\\t';
    else if (ch === '\r') out += '\\r';
    else if (ch === '\f') out += '\\f';
    else if (ch === ' ' && i === 0) out += '\\ ';
    else if (escapeUnicode && ch.charCodeAt(0) > 0x7e) out += unicodeEscape(ch);
    else out += ch;
  }
  return out;
}

function escapeControl(ch) {
  if (ch === '\n') return '\\n';
  if (ch === '\t') return '\\t';
  if (ch === '\r') return '\\r';
  if (ch === '\f') return '\\f';
  return ch;
}

function unicodeEscape(ch) {
  return '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0');
}

function emitProperties(model, opts = {}) {
  const escapeUnicode = opts.escapeUnicode === true;
  const pairs = flattenPairs(model, '', []);
  pairs.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  return pairs
    .map(([k, v]) => `${escapePropertyKey(k)}=${escapePropertyValue(scalarToString(v), escapeUnicode)}`)
    .join('\n');
}

// ---------------------------------------------------------------------
// XML  (element/attribute/text convention)
// ---------------------------------------------------------------------
function decodeEntities(s) {
  return s.replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (m, body) => {
    if (body[0] === '#') {
      const code = body[1] === 'x' || body[1] === 'X'
        ? parseInt(body.slice(2), 16)
        : parseInt(body.slice(1), 10);
      return Number.isFinite(code) ? String.fromCodePoint(code) : m;
    }
    const named = { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" };
    return named[body] !== undefined ? named[body] : m;
  });
}

function encodeEntities(s, isAttr) {
  let out = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (isAttr) out = out.replace(/"/g, '&quot;');
  return out;
}

// Tokenize + build an element tree.
function parseXML(text) {
  const src = text;
  let i = 0;
  const len = src.length;

  function skipMisc() {
    while (i < len) {
      if (src.startsWith('<?', i)) { const e = src.indexOf('?>', i); if (e < 0) throw convertError('XML: unterminated processing instruction.'); i = e + 2; }
      else if (src.startsWith('<!--', i)) { const e = src.indexOf('-->', i); if (e < 0) throw convertError('XML: unterminated comment.'); i = e + 3; }
      else if (src.startsWith('<!', i)) { const e = src.indexOf('>', i); if (e < 0) throw convertError('XML: unterminated declaration.'); i = e + 1; }
      else if (/\s/.test(src[i])) i++;
      else break;
    }
  }

  function parseElement() {
    if (src[i] !== '<') throw convertError('XML: expected an element.');
    i++; // consume '<'
    const name = readName();
    if (!name) throw convertError('XML: malformed opening tag.');
    const attrs = {};
    // attributes
    while (i < len) {
      skipWs();
      if (src[i] === '/' || src[i] === '>') break;
      const attrName = readName();
      if (!attrName) throw convertError(`XML: malformed attribute in <${name}>.`);
      skipWs();
      if (src[i] !== '=') throw convertError(`XML: attribute "${attrName}" is missing a value.`);
      i++; skipWs();
      const q = src[i];
      if (q !== '"' && q !== "'") throw convertError(`XML: attribute "${attrName}" value must be quoted.`);
      i++;
      const end = src.indexOf(q, i);
      if (end < 0) throw convertError(`XML: unterminated attribute value for "${attrName}".`);
      attrs[attrName] = decodeEntities(src.slice(i, end));
      i = end + 1;
    }
    if (src[i] === '/') {
      i++;
      if (src[i] !== '>') throw convertError(`XML: malformed self-closing tag <${name}>.`);
      i++;
      return { name, attrs, children: [], text: '' };
    }
    if (src[i] !== '>') throw convertError(`XML: malformed tag <${name}>.`);
    i++;
    // content
    const children = [];
    let text = '';
    while (i < len) {
      if (src.startsWith('</', i)) {
        i += 2;
        const closeName = readName();
        skipWs();
        if (src[i] !== '>') throw convertError(`XML: malformed closing tag </${closeName}>.`);
        i++;
        if (closeName !== name) throw convertError(`XML: mismatched closing tag </${closeName}> (expected </${name}>).`);
        return { name, attrs, children, text: text.trim() };
      }
      if (src.startsWith('<![CDATA[', i)) {
        const e = src.indexOf(']]>', i);
        if (e < 0) throw convertError('XML: unterminated CDATA section.');
        text += src.slice(i + 9, e);
        i = e + 3;
      } else if (src.startsWith('<!--', i)) {
        const e = src.indexOf('-->', i);
        if (e < 0) throw convertError('XML: unterminated comment.');
        i = e + 3;
      } else if (src.startsWith('<?', i)) {
        const e = src.indexOf('?>', i);
        if (e < 0) throw convertError('XML: unterminated processing instruction.');
        i = e + 2;
      } else if (src[i] === '<') {
        children.push(parseElement());
      } else {
        const nextLt = src.indexOf('<', i);
        const chunk = nextLt < 0 ? src.slice(i) : src.slice(i, nextLt);
        text += decodeEntities(chunk);
        i = nextLt < 0 ? len : nextLt;
      }
    }
    throw convertError(`XML: element <${name}> is never closed.`);
  }

  function readName() {
    const start = i;
    while (i < len && /[^\s/>=]/.test(src[i])) i++;
    return src.slice(start, i);
  }
  function skipWs() { while (i < len && /\s/.test(src[i])) i++; }

  skipMisc();
  if (i >= len || src[i] !== '<') throw convertError('XML: no root element found.');
  const root = parseElement();
  skipMisc();
  return { [root.name]: elementToModel(root) };
}

function elementToModel(el) {
  const attrKeys = Object.keys(el.attrs);
  const hasAttrs = attrKeys.length > 0;
  const hasChildren = el.children.length > 0;

  if (!hasAttrs && !hasChildren) {
    return el.text; // pure text (or '')
  }

  const obj = {};
  for (const k of attrKeys) obj['@' + k] = el.attrs[k];

  // Group children by tag; repeated tags become arrays.
  for (const child of el.children) {
    const value = elementToModel(child);
    if (Object.prototype.hasOwnProperty.call(obj, child.name)) {
      if (!Array.isArray(obj[child.name])) obj[child.name] = [obj[child.name]];
      obj[child.name].push(value);
    } else {
      obj[child.name] = value;
    }
  }
  if (el.text) obj['#text'] = el.text;
  return obj;
}

function emitXML(model, opts = {}) {
  const declaration = opts.declaration !== false;
  const attributesStrategy = opts.attributes === true;
  const indentStr = ' '.repeat(normalizeIndent(opts.indent, 2));

  // Choose a root: an explicit non-default rootName wins; otherwise, if the
  // model is a single-key object, use that key (so parseXML round-trips).
  let rootName = typeof opts.rootName === 'string' && opts.rootName.trim() ? opts.rootName.trim() : '';
  let content = model;
  if (!rootName) {
    if (isPlainObject(model) && Object.keys(model).length === 1) {
      rootName = Object.keys(model)[0];
      content = model[rootName];
    } else {
      rootName = 'root';
    }
  }
  if (!isValidXMLName(rootName)) throw convertError(`XML: "${rootName}" is not a valid element name.`);

  const lines = [];
  if (declaration) lines.push('<?xml version="1.0" encoding="UTF-8"?>');
  renderXMLElement(rootName, content, 0);
  return lines.join('\n');

  function renderXMLElement(name, value, depth) {
    const pad = indentStr.repeat(depth);
    if (Array.isArray(value)) {
      for (const item of value) renderXMLElement(name, item, depth);
      return;
    }
    if (!isPlainObject(value)) {
      const text = value === null || value === undefined ? '' : String(value);
      if (text === '') lines.push(`${pad}<${name}/>`);
      else lines.push(`${pad}<${name}>${encodeEntities(text, false)}</${name}>`);
      return;
    }
    // object: split attributes / text / child elements
    const attrParts = [];
    const childEntries = [];
    let textContent = null;
    for (const [k, v] of Object.entries(value)) {
      if (k === '#text') { textContent = v; continue; }
      if (k[0] === '@') {
        attrParts.push(`${k.slice(1)}="${encodeEntities(scalarToString(v), true)}"`);
        continue;
      }
      const isPrimitive = v === null || typeof v !== 'object';
      if (attributesStrategy && isPrimitive) {
        attrParts.push(`${k}="${encodeEntities(scalarToString(v), true)}"`);
      } else {
        childEntries.push([k, v]);
      }
    }
    const attrStr = attrParts.length ? ' ' + attrParts.join(' ') : '';
    const hasText = textContent !== null && textContent !== undefined && String(textContent) !== '';
    if (childEntries.length === 0 && !hasText) {
      lines.push(`${pad}<${name}${attrStr}/>`);
      return;
    }
    if (childEntries.length === 0 && hasText) {
      lines.push(`${pad}<${name}${attrStr}>${encodeEntities(String(textContent), false)}</${name}>`);
      return;
    }
    lines.push(`${pad}<${name}${attrStr}>`);
    for (const [k, v] of childEntries) renderXMLElement(k, v, depth + 1);
    if (hasText) lines.push(`${indentStr.repeat(depth + 1)}${encodeEntities(String(textContent), false)}`);
    lines.push(`${pad}</${name}>`);
  }
}

function isValidXMLName(name) {
  return /^[A-Za-z_:][A-Za-z0-9._:-]*$/.test(name);
}

// ---------------------------------------------------------------------
// YAML  (practical subset)
// ---------------------------------------------------------------------
function parseYAML(text) {
  if (typeof text !== 'string') throw convertError('YAML input must be text.');
  const src = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rawLines = src.split('\n');
  const lines = [];
  let docCount = 0;
  for (const raw of rawLines) {
    const stripped = stripYAMLComment(raw);
    const trimmed = stripped.trim();
    if (trimmed === '') continue;
    if (trimmed === '---') { docCount++; if (docCount > 1) throw convertError('YAML: multiple documents are not supported.'); continue; }
    if (trimmed === '...') continue;
    if (/^\t/.test(raw) || /^ *\t/.test(raw.slice(0, raw.length - raw.trimStart().length))) {
      throw convertError('YAML: tabs are not allowed for indentation (use spaces).');
    }
    const indent = stripped.length - stripped.trimStart().length;
    const content = stripped.trim();
    // Reject unsupported constructs loudly.
    rejectUnsupportedYAML(content);
    lines.push({ indent, content });
  }
  if (lines.length === 0) return null;
  const [value] = parseYAMLBlock(lines, 0, lines[0].indent);
  return value;
}

function rejectUnsupportedYAML(content) {
  if (/^<<\s*:/.test(content)) throw convertError('YAML: merge keys (<<) are not supported.');
  if (/^\?\s/.test(content)) throw convertError('YAML: complex mapping keys (?) are not supported.');
  // anchors/aliases/tags detected at value position in scalar parse; a bare
  // alias line is caught here.
  if (/^\*[\w-]+\s*$/.test(content)) throw convertError('YAML: aliases (*) are not supported.');
}

function stripYAMLComment(line) {
  let inSingle = false, inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === "'" && !inDouble) inSingle = !inSingle;
    else if (ch === '"' && !inSingle) inDouble = !inDouble;
    else if (ch === '#' && !inSingle && !inDouble) {
      if (i === 0 || /\s/.test(line[i - 1])) return line.slice(0, i);
    }
  }
  return line;
}

function isYAMLSeqEntry(content) {
  return content === '-' || content.startsWith('- ');
}

function isYAMLMapEntry(content) {
  if (isYAMLSeqEntry(content)) return false;
  return splitYAMLKey(content) !== null;
}

// Split "key: value" (colon at end or followed by space), respecting quotes.
function splitYAMLKey(content) {
  let inSingle = false, inDouble = false, inFlow = 0;
  for (let i = 0; i < content.length; i++) {
    const ch = content[i];
    if (ch === "'" && !inDouble) inSingle = !inSingle;
    else if (ch === '"' && !inSingle) inDouble = !inDouble;
    else if (!inSingle && !inDouble) {
      if (ch === '[' || ch === '{') inFlow++;
      else if (ch === ']' || ch === '}') inFlow--;
      else if (ch === ':' && inFlow === 0) {
        const next = content[i + 1];
        if (next === undefined || next === ' ' || next === '\t') {
          const key = content.slice(0, i).trim();
          const rest = content.slice(i + 1).trim();
          return { key: parseYAMLScalar(key, true), rest };
        }
      }
    }
  }
  return null;
}

function parseYAMLBlock(lines, i, indent) {
  if (i >= lines.length) return [null, i];
  if (isYAMLSeqEntry(lines[i].content)) return parseYAMLSequence(lines, i, indent);
  if (isYAMLMapEntry(lines[i].content)) return parseYAMLMapping(lines, i, indent);
  // Neither a mapping nor a sequence at this level: a bare scalar or a flow
  // collection ([ … ] / { … }) standing on its own (a top-level scalar
  // document, or a value written on the line below its key). Without this the
  // block would fall through to an empty mapping and the value would be lost.
  return [parseYAMLScalar(lines[i].content, false), i + 1];
}

function parseYAMLSequence(lines, i, indent) {
  const arr = [];
  while (i < lines.length && lines[i].indent === indent && isYAMLSeqEntry(lines[i].content)) {
    const rest = lines[i].content === '-' ? '' : lines[i].content.slice(2).trim();
    if (rest === '') {
      const j = i + 1;
      if (j < lines.length && lines[j].indent > indent) {
        const [v, ni] = parseYAMLBlock(lines, j, lines[j].indent);
        arr.push(v); i = ni;
      } else { arr.push(null); i = j; }
    } else if (isBlockScalarIndicator(rest)) {
      const [v, ni] = parseYAMLBlockScalar(lines, i + 1, indent, rest);
      arr.push(v); i = ni;
    } else if (isYAMLMapEntry(rest)) {
      // inline map as a sequence item; its keys align at indent+2.
      const childIndent = indent + 2;
      lines[i] = { indent: childIndent, content: rest };
      const [v, ni] = parseYAMLMapping(lines, i, childIndent);
      arr.push(v); i = ni;
    } else {
      arr.push(parseYAMLScalar(rest, false));
      i++;
    }
  }
  return [arr, i];
}

function parseYAMLMapping(lines, i, indent) {
  const obj = {};
  while (i < lines.length && lines[i].indent === indent && isYAMLMapEntry(lines[i].content)) {
    const split = splitYAMLKey(lines[i].content);
    const key = String(split.key);
    const rest = split.rest;
    if (rest === '') {
      const j = i + 1;
      if (j < lines.length && (lines[j].indent > indent ||
          (lines[j].indent === indent && isYAMLSeqEntry(lines[j].content)))) {
        const childIndent = lines[j].indent;
        const [v, ni] = parseYAMLBlock(lines, j, childIndent);
        obj[key] = v; i = ni;
      } else { obj[key] = null; i = j; }
    } else if (isBlockScalarIndicator(rest)) {
      const [v, ni] = parseYAMLBlockScalar(lines, i + 1, indent, rest);
      obj[key] = v; i = ni;
    } else {
      obj[key] = parseYAMLScalar(rest, false);
      i++;
    }
  }
  return [obj, i];
}

function isBlockScalarIndicator(s) {
  return /^[|>][-+]?\d*\s*$/.test(s);
}

function parseYAMLBlockScalar(lines, i, parentIndent, indicator) {
  const folded = indicator[0] === '>';
  const chomp = indicator.includes('-') ? 'strip' : indicator.includes('+') ? 'keep' : 'clip';
  const collected = [];
  let blockIndent = null;
  while (i < lines.length && lines[i].indent > parentIndent) {
    if (blockIndent === null) blockIndent = lines[i].indent;
    collected.push(' '.repeat(lines[i].indent - blockIndent) + lines[i].content);
    i++;
  }
  let value;
  if (folded) value = collected.join(' ');
  else value = collected.join('\n');
  if (chomp === 'strip') value = value.replace(/\n+$/, '');
  else if (chomp === 'clip' && collected.length) value = value + '\n';
  return [value, i];
}

// Parse a scalar or flow collection. isKey suppresses type inference.
function parseYAMLScalar(s, isKey) {
  const t = s.trim();
  if (t === '') return isKey ? '' : null;
  if (t[0] === '[' || t[0] === '{') return parseYAMLFlow(t);
  if (t[0] === '"') return parseYAMLDoubleQuoted(t);
  if (t[0] === "'") return parseYAMLSingleQuoted(t);
  if (!isKey) {
    if (t[0] === '&') throw convertError('YAML: anchors (&) are not supported.');
    if (t[0] === '*') throw convertError('YAML: aliases (*) are not supported.');
    if (t[0] === '!') throw convertError('YAML: tags (!) are not supported.');
  }
  if (isKey) return t;
  return inferYAMLScalar(t);
}

function inferYAMLScalar(t) {
  if (t === 'null' || t === '~' || t === 'Null' || t === 'NULL') return null;
  if (t === 'true' || t === 'True' || t === 'TRUE') return true;
  if (t === 'false' || t === 'False' || t === 'FALSE') return false;
  if (/^[-+]?\d+$/.test(t)) {
    const n = Number(t);
    if (Number.isSafeInteger(n)) return n;
  }
  if (/^[-+]?(\d+\.\d*|\.\d+|\d+)([eE][-+]?\d+)?$/.test(t) && /[.eE]/.test(t)) {
    const n = Number(t);
    if (Number.isFinite(n)) return n;
  }
  return t;
}

function parseYAMLDoubleQuoted(t) {
  if (t[t.length - 1] !== '"' || t.length < 2) throw convertError('YAML: unterminated double-quoted string.');
  const inner = t.slice(1, -1);
  let out = '';
  for (let i = 0; i < inner.length; i++) {
    const ch = inner[i];
    if (ch !== '\\') { out += ch; continue; }
    const next = inner[i + 1];
    const map = { n: '\n', t: '\t', r: '\r', '"': '"', '\\': '\\', '/': '/', '0': '\0', b: '\b', f: '\f' };
    if (next === 'u') {
      const hex = inner.slice(i + 2, i + 6);
      if (/^[0-9a-fA-F]{4}$/.test(hex)) { out += String.fromCharCode(parseInt(hex, 16)); i += 5; continue; }
    }
    out += map[next] !== undefined ? map[next] : next;
    i += 1;
  }
  return out;
}

function parseYAMLSingleQuoted(t) {
  if (t[t.length - 1] !== "'" || t.length < 2) throw convertError('YAML: unterminated single-quoted string.');
  return t.slice(1, -1).replace(/''/g, "'");
}

// Minimal flow-collection parser for [ ... ] and { ... }.
function parseYAMLFlow(s) {
  let i = 0;
  const parsed = parseFlowValue();
  skipFlowWs();
  if (i < s.length) throw convertError('YAML: could not parse flow collection.');
  return parsed;

  function skipFlowWs() { while (i < s.length && /\s/.test(s[i])) i++; }

  function parseFlowValue() {
    skipFlowWs();
    const ch = s[i];
    if (ch === '[') return parseFlowSeq();
    if (ch === '{') return parseFlowMap();
    if (ch === '"' || ch === "'") return parseFlowQuoted();
    return parseFlowScalar();
  }

  function parseFlowSeq() {
    i++; // [
    const arr = [];
    skipFlowWs();
    if (s[i] === ']') { i++; return arr; }
    while (i < s.length) {
      arr.push(parseFlowValue());
      skipFlowWs();
      if (s[i] === ',') { i++; skipFlowWs(); if (s[i] === ']') { i++; return arr; } continue; }
      if (s[i] === ']') { i++; return arr; }
      throw convertError('YAML: malformed flow sequence.');
    }
    throw convertError('YAML: unterminated flow sequence.');
  }

  function parseFlowMap() {
    i++; // {
    const obj = {};
    skipFlowWs();
    if (s[i] === '}') { i++; return obj; }
    while (i < s.length) {
      skipFlowWs();
      const key = (s[i] === '"' || s[i] === "'") ? parseFlowQuoted() : parseFlowMapKey();
      skipFlowWs();
      if (s[i] !== ':') throw convertError('YAML: flow mapping key missing ":".');
      i++;
      obj[String(key)] = parseFlowValue();
      skipFlowWs();
      if (s[i] === ',') { i++; skipFlowWs(); if (s[i] === '}') { i++; return obj; } continue; }
      if (s[i] === '}') { i++; return obj; }
      throw convertError('YAML: malformed flow mapping.');
    }
    throw convertError('YAML: unterminated flow mapping.');
  }

  function parseFlowQuoted() {
    const q = s[i];
    let j = i + 1, out = '';
    if (q === "'") {
      while (j < s.length) {
        if (s[j] === "'") { if (s[j + 1] === "'") { out += "'"; j += 2; continue; } break; }
        out += s[j]; j++;
      }
      if (s[j] !== "'") throw convertError('YAML: unterminated quoted string in flow.');
      i = j + 1; return out;
    }
    while (j < s.length && s[j] !== '"') {
      if (s[j] === '\\') { out += s[j] + (s[j + 1] || ''); j += 2; continue; }
      out += s[j]; j++;
    }
    if (s[j] !== '"') throw convertError('YAML: unterminated quoted string in flow.');
    i = j + 1;
    return parseYAMLDoubleQuoted('"' + out + '"');
  }

  function parseFlowScalar() {
    const start = i;
    while (i < s.length && !',[]{}:'.includes(s[i])) i++;
    return inferYAMLScalar(s.slice(start, i).trim());
  }
  function parseFlowMapKey() {
    const start = i;
    while (i < s.length && s[i] !== ':' && !',[]{}'.includes(s[i])) i++;
    return s.slice(start, i).trim();
  }
}

// ---- YAML emit ----
function emitYAML(model, opts = {}) {
  const indent = normalizeIndent(opts.indent, 2) || 2;
  const lines = [];
  emitYAMLValue(model, 0, lines, indent);
  return lines.join('\n');
}

function emitYAMLValue(value, depth, lines, indent) {
  const pad = ' '.repeat(depth * indent);
  if (Array.isArray(value)) {
    if (value.length === 0) { lines.push(`${pad}[]`); return; }
    for (const item of value) {
      if (isPlainObject(item) && Object.keys(item).length > 0) {
        lines.push(`${pad}-`);
        emitYAMLValue(item, depth + 1, lines, indent);
      } else if (Array.isArray(item) && item.length > 0) {
        lines.push(`${pad}-`);
        emitYAMLValue(item, depth + 1, lines, indent);
      } else {
        lines.push(`${pad}- ${emitYAMLScalar(item)}`);
      }
    }
    return;
  }
  if (isPlainObject(value)) {
    const keys = Object.keys(value);
    if (keys.length === 0) { lines.push(`${pad}{}`); return; }
    for (const k of keys) {
      const v = value[k];
      const keyStr = emitYAMLKey(k);
      if ((isPlainObject(v) && Object.keys(v).length > 0) ||
          (Array.isArray(v) && v.length > 0)) {
        lines.push(`${pad}${keyStr}:`);
        emitYAMLValue(v, depth + 1, lines, indent);
      } else {
        lines.push(`${pad}${keyStr}: ${emitYAMLScalar(v)}`);
      }
    }
    return;
  }
  // top-level scalar
  lines.push(`${pad}${emitYAMLScalar(value)}`);
}

function emitYAMLKey(k) {
  const s = String(k);
  if (yamlNeedsQuoting(s)) return JSON.stringify(s);
  return s;
}

function emitYAMLScalar(v) {
  if (v === null || v === undefined) return 'null';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return Number.isFinite(v) ? String(v) : JSON.stringify(String(v));
  if (Array.isArray(v)) return '[]';
  if (isPlainObject(v)) return '{}';
  const s = String(v);
  if (yamlNeedsQuoting(s)) return JSON.stringify(s);
  return s;
}

function yamlNeedsQuoting(s) {
  if (s === '') return true;
  if (/^\s|\s$/.test(s)) return true;
  if (/[:#\[\]{}&*!|>'"%@`,]/.test(s)) return true;
  if (/^[-?]/.test(s)) return true;
  if (/[\n\t]/.test(s)) return true;
  // Would re-parse as a non-string scalar
  const inferred = inferYAMLScalar(s);
  if (typeof inferred !== 'string') return true;
  return false;
}

// ---------------------------------------------------------------------
// Auto-detect
// ---------------------------------------------------------------------
function detectFormat(text) {
  if (typeof text !== 'string') return null;
  const trimmed = text.trim();
  if (trimmed === '') return null;

  if (/^<\?xml/i.test(trimmed) || /^<[A-Za-z_!]/.test(trimmed)) return 'xml';

  const first = trimmed[0];
  if (first === '{' || first === '[' || first === '"') {
    try { JSON.parse(trimmed); return 'json'; } catch { /* fall through */ }
  }

  const lines = trimmed.split('\n').filter((l) => {
    const t = l.trim();
    return t !== '' && t[0] !== '#' && t[0] !== '!';
  });
  if (lines.length === 0) return null;

  // TSV: a tab in the first line, consistent-ish columns.
  if (lines[0].includes('\t')) return 'tsv';

  // Count signal lines for properties vs yaml.
  let eqLines = 0, mapLines = 0, seqLines = 0, commaLines = 0;
  for (const l of lines) {
    const t = l.trim();
    if (t.startsWith('- ') || t === '-') { seqLines++; continue; }
    if (/^[^:=\s][^=]*=/.test(t)) eqLines++;
    if (/^[^:#]+:(\s|$)/.test(t)) mapLines++;
    if (l.includes(',')) commaLines++;
  }
  if (/^---/.test(trimmed) || seqLines > 0) return 'yaml';
  if (eqLines > mapLines && eqLines > 0) return 'properties';
  if (mapLines > 0) return 'yaml';
  // A line starting with `[` or `{` is a JSON/flow structure, never a CSV record — don't let
  // truncated JSON (e.g. `[1,`) fall through to the comma heuristic and parse to a silent [] (#1014-M).
  if (commaLines === lines.length && lines[0].includes(',') && first !== '[' && first !== '{') return 'csv';
  if (eqLines > 0) return 'properties';
  return null;
}

// ---------------------------------------------------------------------
// Top-level convert
// ---------------------------------------------------------------------
const PARSERS = {
  json: (t) => parseJSON(t),
  csv: (t, o) => parseCSV(t, o.csv || {}),
  tsv: (t, o) => parseTSV(t, o.tsv || {}),
  yaml: (t) => parseYAML(t),
  properties: (t) => parseProperties(t),
  xml: (t) => parseXML(t),
};
const EMITTERS = {
  json: (m, o) => emitJSON(m, o.json || {}),
  csv: (m, o) => emitCSV(m, o.csv || {}),
  tsv: (m, o) => emitTSV(m, o.tsv || {}),
  yaml: (m, o) => emitYAML(m, o.yaml || {}),
  properties: (m, o) => emitProperties(m, o.properties || {}),
  xml: (m, o) => emitXML(m, o.xml || {}),
};

function convert(text, from, to, opts = {}) {
  let source = from;
  if (from === 'auto') {
    source = detectFormat(text);
    if (!source) throw convertError('Could not auto-detect the input format — pick a source format.');
  }
  const parser = PARSERS[source];
  if (!parser) throw convertError(`Unknown source format: ${source}`);
  const emitter = EMITTERS[to];
  if (!emitter) throw convertError(`Unknown target format: ${to}`);
  const model = parser(text, opts);
  return { output: emitter(model, opts), detected: source, model };
}

// =====================================================================
// Format Converter — pure logic (DOM-free, unit-testable).
//
// The structured-data conversion engine (JSON / CSV / TSV / YAML / .properties
// / XML parse+emit registry, detectFormat, convert) now lives in the shared,
// Node-importable module lib/formats/CtFormat.mjs (promoted to jason-code,
// vendored here). This file imports it and re-exports its API unchanged, so the
// unit tests (which read this module's namespace) and app.mjs (which inlines
// this file at build time) see the same surface. The build resolves the import
// and inlines the engine body (stripping each export) so the shipped index.html
// stays dependency-free and file://-openable.
// =====================================================================


  // =====================================================================
  // 1. Constants, state & persistence
  // =====================================================================
  const FORMAT_LABEL = {
    json: 'JSON', csv: 'CSV', tsv: 'TSV', yaml: 'YAML',
    properties: '.properties', xml: 'XML',
  };

  const SAMPLES = {
    json: '{\n  "name": "Ada Lovelace",\n  "born": 1815,\n  "fields": ["mathematics", "computing"],\n  "active": false,\n  "address": {\n    "city": "London",\n    "country": "UK"\n  }\n}',
    csv: 'name,born,city\nAda Lovelace,1815,London\nGrace Hopper,1906,"New York, NY"\nAlan Turing,1912,London',
    tsv: 'name\tborn\tcity\nAda Lovelace\t1815\tLondon\nGrace Hopper\t1906\tNew York\nAlan Turing\t1912\tLondon',
    yaml: '# A sample YAML document\nname: Ada Lovelace\nborn: 1815\nfields:\n  - mathematics\n  - computing\naddress:\n  city: London\n  country: UK\npeople:\n  - name: Grace Hopper\n    born: 1906\n  - name: Alan Turing\n    born: 1912',
    properties: 'name=Ada Lovelace\nborn=1815\nfields.0=mathematics\nfields.1=computing\naddress.city=London\naddress.country=UK',
    xml: '<?xml version="1.0" encoding="UTF-8"?>\n<person id="1">\n  <name>Ada Lovelace</name>\n  <born>1815</born>\n  <fields>\n    <field>mathematics</field>\n    <field>computing</field>\n  </fields>\n  <address>\n    <city>London</city>\n    <country>UK</country>\n  </address>\n</person>',
  };

  const STORAGE_KEY = 'format-converter:v1';
  const HELP_SEEN_KEY = 'format-converter:help-seen:v1';

  const state = {
    from: 'auto',
    to: 'yaml',
    input: '',
    opts: {
      delimiter: ',',
      header: true,
      indent: 2,
      xmlRoot: 'root',
      xmlAttrs: false,
      xmlDecl: true,
      propsUnicode: false,
    },
  };


  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        from: state.from, to: state.to, input: inputEl.value, opts: state.opts,
      }));
    } catch (err) { /* best-effort: in-memory only */ }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const p = JSON.parse(raw);
      const valid = new Set(['auto', 'json', 'csv', 'tsv', 'yaml', 'properties', 'xml']);
      if (valid.has(p.from)) state.from = p.from;
      if (valid.has(p.to) && p.to !== 'auto') state.to = p.to;
      if (typeof p.input === 'string') state.input = p.input;
      const o = p && p.opts || {};
      if (typeof o.delimiter === 'string') state.opts.delimiter = o.delimiter;
      if (typeof o.header === 'boolean') state.opts.header = o.header;
      if ([0, 2, 4].includes(o.indent)) state.opts.indent = o.indent;
      if (typeof o.xmlRoot === 'string') state.opts.xmlRoot = o.xmlRoot;
      if (typeof o.xmlAttrs === 'boolean') state.opts.xmlAttrs = o.xmlAttrs;
      if (typeof o.xmlDecl === 'boolean') state.opts.xmlDecl = o.xmlDecl;
      if (typeof o.propsUnicode === 'boolean') state.opts.propsUnicode = o.propsUnicode;
    } catch (err) { /* ignore unreadable state */ }
  }

  // =====================================================================
  // 2. DOM references
  // =====================================================================
  const helpButtonEl = document.getElementById('help-button');

  const fromSelect = document.getElementById('from-format');
  const toSelect = document.getElementById('to-format');
  const swapBtn = document.getElementById('swap-btn');
  const detectStatusEl = document.querySelector('[data-testid="detect-status"]');

  const inputEl = document.getElementById('input');
  const outputEl = document.getElementById('output');
  const errorEl = document.querySelector('[data-testid="error"]');
  const clearBtn = document.getElementById('clear-btn');
  const sampleBtn = document.getElementById('sample-btn');
  const copyBtn = document.getElementById('copy-btn');
  const inputCopyBtn = document.getElementById('input-copy-btn');

  const optGroupCsv = document.querySelector('[data-testid="opt-group-csv"]');
  const optGroupIndent = document.querySelector('[data-testid="opt-group-indent"]');
  const optGroupXml = document.querySelector('[data-testid="opt-group-xml"]');
  const optGroupProps = document.querySelector('[data-testid="opt-group-properties"]');
  const optEmpty = document.querySelector('[data-testid="opt-empty"]');

  const optDelimiter = document.getElementById('opt-delimiter');
  const optHeader = document.getElementById('opt-header');
  const optIndent = document.getElementById('opt-indent');
  const optXmlRoot = document.getElementById('opt-xml-root');
  const optXmlAttrs = document.getElementById('opt-xml-attrs');
  const optXmlDecl = document.getElementById('opt-xml-decl');
  const optPropsUnicode = document.getElementById('opt-props-unicode');

  // =====================================================================
  // 3. Options visibility + build opts object
  // =====================================================================
  function involves(fmt) {
    return state.from === fmt || state.to === fmt;
  }

  function updateOptionsVisibility() {
    const csv = involves('csv') || involves('tsv');
    const indent = state.to === 'json' || state.to === 'yaml';
    const xml = state.to === 'xml';
    const props = state.to === 'properties';

    optGroupCsv.hidden = !csv;
    optGroupIndent.hidden = !indent;
    optGroupXml.hidden = !xml;
    optGroupProps.hidden = !props;
    optEmpty.hidden = csv || indent || xml || props;

    // Delimiter only meaningful for CSV; TSV is always tab.
    const csvInvolved = involves('csv');
    optDelimiter.disabled = !csvInvolved;
    if (!csvInvolved && csv) optDelimiter.title = 'TSV always uses a tab delimiter';
    else optDelimiter.title = '';
  }

  function buildOpts() {
    const delimiter = state.opts.delimiter.replace(/\\t/g, '\t') || ',';
    return {
      csv: { delimiter, header: state.opts.header },
      tsv: { header: state.opts.header },
      json: { indent: state.opts.indent },
      yaml: { indent: state.opts.indent },
      xml: {
        rootName: state.opts.xmlRoot,
        attributes: state.opts.xmlAttrs,
        declaration: state.opts.xmlDecl,
        indent: state.opts.indent || 2,
      },
      properties: { escapeUnicode: state.opts.propsUnicode },
    };
  }

  // =====================================================================
  // 4. Render
  // =====================================================================
  function showErrorBanner(msg) { showError(errorEl, msg); outputEl.value = ''; }
  function hideErrorBanner() { hideError(errorEl); errorEl.textContent = ''; }

  // In-field copy button reveals only when the input is non-empty (an icon must
  // never float over placeholder text). Output's copy button shows always.
  function updateInputCopyVisibility() {
    inputCopyBtn.hidden = inputEl.value === '';
  }

  function render() {
    updateOptionsVisibility();
    updateInputCopyVisibility();
    const text = inputEl.value;
    if (text.trim() === '') {
      hideErrorBanner();
      outputEl.value = '';
      detectStatusEl.innerHTML = state.from === 'auto'
        ? 'Source format is auto-detected from what you paste.' : '';
      return;
    }
    let result;
    try {
      result = convert(text, state.from, state.to, buildOpts());
    } catch (err) {
      showErrorBanner(err.message || String(err));
      if (state.from === 'auto') {
        const guess = detectFormat(text);
        detectStatusEl.innerHTML = guess
          ? `Detected <strong>${FORMAT_LABEL[guess]}</strong>`
          : 'Could not auto-detect the format.';
      } else {
        detectStatusEl.innerHTML = '';
      }
      return;
    }
    hideErrorBanner();
    outputEl.value = result.output;
    detectStatusEl.innerHTML = state.from === 'auto'
      ? `Detected <strong>${FORMAT_LABEL[result.detected]}</strong>`
      : '';
  }

  // =====================================================================
  // 5. Event wiring
  // =====================================================================
  fromSelect.addEventListener('change', () => {
    state.from = fromSelect.value;
    render();
    saveState();
  });
  toSelect.addEventListener('change', () => {
    state.to = toSelect.value;
    render();
    saveState();
  });

  swapBtn.addEventListener('click', () => {
    // Swap From/To. If From is Auto-detect, resolve it to the detected format
    // first so the swap is meaningful.
    let from = state.from;
    if (from === 'auto') from = detectFormat(inputEl.value) || 'json';
    const newFrom = state.to;
    const newTo = from;
    state.from = newFrom;
    state.to = newTo;
    // Feed the current output back in as the new input (round-trip friendly).
    if (outputEl.value) inputEl.value = outputEl.value;
    fromSelect.value = state.from;
    toSelect.value = state.to;
    render();
    saveState();
  });

  inputEl.addEventListener('input', () => { render(); saveState(); });

  clearBtn.addEventListener('click', async () => {
    if (inputEl.value.trim() !== '') {
      const ok = await confirmDialog('Clear the input? This can’t be undone.');
      if (!ok) return;
    }
    inputEl.value = '';
    render();
    saveState();
    document.activeElement?.blur();
    inputEl.focus();
  });

  sampleBtn.addEventListener('click', async () => {
    let fmt = state.from;
    if (fmt === 'auto') fmt = 'json';
    const sample = SAMPLES[fmt] || SAMPLES.json;
    if (inputEl.value.trim() !== '' && inputEl.value !== sample) {
      const ok = await confirmDialog('Replace the input with a sample document?');
      if (!ok) return;
    }
    inputEl.value = sample;
    render();
    saveState();
  });

  copyBtn.addEventListener('click', async () => {
    if (!outputEl.value) return;
    const ok = await copy(outputEl.value);
    if (!ok) return;
    flash(copyBtn, { label: '✅', revertTo: '📋' });
  });

  inputCopyBtn.addEventListener('click', async () => {
    if (!inputEl.value) return;
    const ok = await copy(inputEl.value);
    if (!ok) return;
    flash(inputCopyBtn, { label: '✅', revertTo: '📋' });
  });

  // Option inputs
  optDelimiter.addEventListener('input', () => {
    state.opts.delimiter = optDelimiter.value;
    render();
    saveState();
  });
  optHeader.addEventListener('change', () => {
    state.opts.header = optHeader.checked;
    render();
    saveState();
  });
  optIndent.addEventListener('change', () => {
    state.opts.indent = Number(optIndent.value);
    render();
    saveState();
  });
  optXmlRoot.addEventListener('input', () => {
    state.opts.xmlRoot = optXmlRoot.value;
    render();
    saveState();
  });
  optXmlAttrs.addEventListener('change', () => {
    state.opts.xmlAttrs = optXmlAttrs.checked;
    render();
    saveState();
  });
  optXmlDecl.addEventListener('change', () => {
    state.opts.xmlDecl = optXmlDecl.checked;
    render();
    saveState();
  });
  optPropsUnicode.addEventListener('change', () => {
    state.opts.propsUnicode = optPropsUnicode.checked;
    render();
    saveState();
  });

  // =====================================================================
  // 6. Help modal
  // =====================================================================
  // The Help dialog is the shared jbcModal primitive (lib/components/CtModal.mjs),
  // built from the hidden #help-body template. Focus-trap / Esc + backdrop
  // close / focus return / reduced-motion all live in the primitive.
  // `testid: 'help'` keeps the help-overlay / help-modal / modal-close-x hooks;
  // `titleId` pins aria-labelledby; `autoOpen` rides the shared onceFlag
  // so Help auto-shows once on a fresh visit.
  const help = createModal({
    testid: 'help',
    titleId: 'help-title',
    title: 'Format Converter',
    body: document.getElementById('help-body').content.cloneNode(true),
    autoOpen: onceFlag(HELP_SEEN_KEY),
  });
  helpButtonEl.addEventListener('click', () => help.open());

  // =====================================================================
  // 7. Init
  // =====================================================================
  (function init() {
    loadState();

    fromSelect.value = state.from;
    toSelect.value = state.to;
    inputEl.value = state.input;
    optDelimiter.value = state.opts.delimiter;
    optHeader.checked = state.opts.header;
    optIndent.value = String(state.opts.indent);
    optXmlRoot.value = state.opts.xmlRoot;
    optXmlAttrs.checked = state.opts.xmlAttrs;
    optXmlDecl.checked = state.opts.xmlDecl;
    optPropsUnicode.checked = state.opts.propsUnicode;

    render();

    // The Help modal auto-shows once on a fresh visit via jbcModal's autoOpen.
  })();

  // =====================================================================
  // 8. Test hook — inert namespace for Playwright / unit-driven tests
  // =====================================================================
  window.__formatConverter = {
    // pure functions
    FORMATS,
    parseJSON, emitJSON,
    parseYAML, emitYAML,
    parseCSV, emitCSV,
    parseTSV, emitTSV,
    parseProperties, emitProperties,
    parseXML, emitXML,
    detectFormat, convert,
    // deterministic entry points
    render, buildOpts,
    // live state
    state,
  };
</script>
</body>
