<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-row">
      <div class="header-titles">
        <h1>Visual Diff</h1>
        <p class="subtitle">Compare two blocks of text — line and word diff, side-by-side or inline. All local, nothing leaves your browser.</p>
      </div>
      <button
        id="help-button"
        type="button"
        class="help-button"
        data-testid="help-button"
        title="How it works"
        aria-label="How it works"
      >?</button>
    </div>
  </header>

  <section class="inputs" data-testid="inputs">
    <div class="field">
      <div class="field-head">
        <label for="inputA">A — original</label>
        <button type="button" id="clearABtn" data-testid="clear-a-btn" class="link-btn" title="Clear A" aria-label="Clear A">Clear</button>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="inputA" data-testid="input-a" rows="10" spellcheck="false"
          placeholder="Paste or type the original text..."></textarea>
        <button type="button" id="copyABtn" data-testid="copy-a-btn" class="ct-copy-btn"
          title="Copy A" aria-label="Copy A" hidden>📋</button>
      </div>
    </div>

    <div class="swap-wrap">
      <button type="button" id="swapBtn" data-testid="swap-btn" class="swap-btn" title="Swap A and B" aria-label="Swap A and B">⇄</button>
    </div>

    <div class="field">
      <div class="field-head">
        <label for="inputB">B — changed</label>
        <button type="button" id="clearBBtn" data-testid="clear-b-btn" class="link-btn" title="Clear B" aria-label="Clear B">Clear</button>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="inputB" data-testid="input-b" rows="10" spellcheck="false"
          placeholder="Paste or type the changed text..."></textarea>
        <button type="button" id="copyBBtn" data-testid="copy-b-btn" class="ct-copy-btn"
          title="Copy B" aria-label="Copy B" hidden>📋</button>
      </div>
    </div>
  </section>

  <section class="controls" data-testid="controls">
    <div class="options" role="group" aria-label="Diff options">
      <label class="opt"><input type="checkbox" id="optTrim" data-testid="opt-trim"> Ignore leading/trailing whitespace</label>
      <label class="opt"><input type="checkbox" id="optAllWs" data-testid="opt-all-ws"> Ignore all whitespace</label>
      <label class="opt"><input type="checkbox" id="optCase" data-testid="opt-case"> Ignore case</label>
    </div>

    <div class="controls-right">
      <button type="button" id="loadSampleBtn" data-testid="load-sample" class="sample-btn"
        title="Load a sample before/after into A and B" aria-label="Load a sample before/after into A and B">Load sample</button>
      <div class="view-toggle" data-testid="view-toggle" role="group" aria-label="View">
        <button type="button" id="viewSplitBtn" data-testid="view-split-btn" data-value="split" aria-pressed="true">Side-by-side</button>
        <button type="button" id="viewInlineBtn" data-testid="view-inline-btn" data-value="inline" aria-pressed="false">Inline</button>
      </div>
      <button type="button" id="copyUnifiedBtn" data-testid="copy-unified-btn"
        title="Copy unified diff" aria-label="Copy unified diff" disabled>📋 Copy unified diff</button>
    </div>
  </section>

  <p class="stats" data-testid="stats" role="status" aria-live="polite"></p>
  <p class="warning" data-testid="size-warning" role="status" aria-live="polite" hidden></p>

  <div class="diff-legend" data-testid="diff-legend" role="group" aria-label="Diff color legend">
    <span class="lg-item">
      <span class="lg-swatch lg-swatch--add" aria-hidden="true"></span>green = added line
    </span>
    <span class="lg-item">
      <span class="lg-swatch lg-swatch--del" aria-hidden="true"></span>red = removed line
    </span>
    <span class="lg-item">
      <span class="lg-swatch lg-swatch--chg" aria-hidden="true"></span>yellow = changed line
    </span>
  </div>

  <section class="diff-output" data-testid="diff-output">
    <div class="diff-split" data-testid="diff-split"></div>
    <div class="diff-inline" data-testid="diff-inline" hidden></div>
  </section>
</div>

<!-- Help modal is built at runtime by the shared jbcModal primitive
     (lib/modal.js) from this hidden template. The <h2> title is
     supplied via jbcModal's `title` option, so it is not repeated here. -->
<template id="help-body">
    <p>Everything runs locally in your browser — nothing you type or paste here is ever sent anywhere.</p>
    <ul>
      <li><strong>Paste two texts.</strong> Put the original in <strong>A</strong> and the changed version in <strong>B</strong>. The diff updates live as you type. <strong>⇄</strong> swaps the two sides.</li>
      <li><strong>Line diff.</strong> A hand-rolled Myers diff aligns the two texts line by line and marks each line <span class="lg lg-add">added</span>, <span class="lg lg-del">removed</span>, or <span class="lg lg-chg">changed</span>. Changed lines also get a <strong>word-level</strong> highlight showing exactly what differs within the line.</li>
      <li><strong>Views.</strong> <strong>Side-by-side</strong> shows A and B in two aligned columns; <strong>Inline</strong> shows one column of <code>+</code>/<code>−</code> lines (a unified view). Toggle between them any time.</li>

    x = prevX; y = prevY;
  }
  // d === 0 leg: any remaining is a leading equal run.
  while (x > 0 && y > 0) { ops.push({ type: 'equal' }); x--; y--; }

  ops.reverse();
  return ops;
}

// ---- line-level diff --------------------------------------------------
// Returns { ops, stats }. Each op: { type, aStart, bStart, aLines, bLines }
// (aStart/bStart are 0-based positions in the original line arrays).
function diffLines(a, b, opts = {}) {
  const aLines = splitLines(a);
  const bLines = splitLines(b);
  const aKey = aLines.map((l) => normalizeLine(l, opts));
  const bKey = bLines.map((l) => normalizeLine(l, opts));
  const raw = myersDiff(aKey, bKey);

  const ops = [];
  let ai = 0;
  let bi = 0;
  let i = 0;
  while (i < raw.length) {
    if (raw[i].type === 'equal') {
      const aS = ai;
      const bS = bi;
      while (i < raw.length && raw[i].type === 'equal') { ai++; bi++; i++; }
      ops.push({
        type: 'equal', aStart: aS, bStart: bS,
        aLines: aLines.slice(aS, ai), bLines: bLines.slice(bS, bi),
      });
    } else {
      const aS = ai;
      const bS = bi;
      let dels = 0;
      let ins = 0;
      while (i < raw.length && raw[i].type !== 'equal') {
        if (raw[i].type === 'delete') { ai++; dels++; }
        else { bi++; ins++; }
        i++;
      }
      if (dels && ins) {
        ops.push({
          type: 'replace', aStart: aS, bStart: bS,
          aLines: aLines.slice(aS, ai), bLines: bLines.slice(bS, bi),
        });
      } else if (dels) {
        ops.push({ type: 'delete', aStart: aS, bStart: bS, aLines: aLines.slice(aS, ai), bLines: [] });
      } else {
        ops.push({ type: 'insert', aStart: aS, bStart: bS, aLines: [], bLines: bLines.slice(bS, bi) });
      }
    }
  }
  return { ops, stats: computeStats(ops) };
}

function computeStats(ops) {
  let added = 0;
  let removed = 0;
  let changed = 0;
  for (const op of ops) {
    if (op.type === 'insert') {
      added += op.bLines.length;
    } else if (op.type === 'delete') {
      removed += op.aLines.length;
    } else if (op.type === 'replace') {
      const paired = Math.min(op.aLines.length, op.bLines.length);
      changed += paired;
      if (op.aLines.length > paired) removed += op.aLines.length - paired;
      if (op.bLines.length > paired) added += op.bLines.length - paired;
    }
  }
  return { added, removed, changed };
}

// ---- word-level (intra-line) diff -------------------------------------
// Tokenize into word-runs / whitespace-runs / single other chars — lossless
// (join('') reproduces the input).
function tokenizeWords(str) {
  const s = String(str ?? '');
  const tokens = s.match(/\s+|[A-Za-z0-9_]+|[^\sA-Za-z0-9_]/g);
  return tokens || [];
}

// Returns [{ type:'equal'|'delete'|'insert', text }] with adjacent same-type
// segments coalesced.
function diffWords(a, b) {
  const at = tokenizeWords(a);
  const bt = tokenizeWords(b);
  const raw = myersDiff(at, bt);
  const segs = [];
  let ai = 0;
  let bi = 0;
  for (const op of raw) {
    let text;
    if (op.type === 'equal') { text = at[ai]; ai++; bi++; }
    else if (op.type === 'delete') { text = at[ai]; ai++; }
    else { text = bt[bi]; bi++; }
    const last = segs[segs.length - 1];
    if (last && last.type === op.type) last.text += text;
    else segs.push({ type: op.type, text });
  }
  return segs;
}

// ---- unified diff -----------------------------------------------------
function toUnifiedDiff(a, b, opts = {}, cfg = {}) {
  const context = cfg.context == null ? 3 : Math.max(0, cfg.context | 0);
  const aName = cfg.aName || 'a';
  const bName = cfg.bName || 'b';
  const { ops } = diffLines(a, b, opts);

  // Flatten ops -> tagged rows with running 1-based line numbers.
  const rows = [];
  let an = 0;
  let bn = 0;
  for (const op of ops) {
    if (op.type === 'equal') {
      for (let i = 0; i < op.aLines.length; i++) {
        rows.push({ tag: ' ', text: op.aLines[i], a: ++an, b: ++bn });
      }
    } else if (op.type === 'delete') {
      for (const l of op.aLines) rows.push({ tag: '-', text: l, a: ++an, b: null });
    } else if (op.type === 'insert') {
      for (const l of op.bLines) rows.push({ tag: '+', text: l, a: null, b: ++bn });
    } else { // replace: deletes then inserts
      for (const l of op.aLines) rows.push({ tag: '-', text: l, a: ++an, b: null });
      for (const l of op.bLines) rows.push({ tag: '+', text: l, a: null, b: ++bn });
    }
  }

  const changedIdx = [];
  for (let i = 0; i < rows.length; i++) if (rows[i].tag !== ' ') changedIdx.push(i);
  if (changedIdx.length === 0) return '';

  // Group changed rows into hunks, padding by `context` and merging groups
  // whose gaps are within 2*context.
  const groups = [];
  let start = changedIdx[0];
  let end = changedIdx[0];
  for (let n = 1; n < changedIdx.length; n++) {
    if (changedIdx[n] - end <= 2 * context + 1) {
      end = changedIdx[n];
    } else {
      groups.push([start, end]);
      start = changedIdx[n];
      end = changedIdx[n];
    }
  }
  groups.push([start, end]);

  const out = [`--- ${aName}`, `+++ ${bName}`];
  for (const [gs, ge] of groups) {
    const hs = Math.max(0, gs - context);
    const he = Math.min(rows.length - 1, ge + context);
    const hunk = rows.slice(hs, he + 1);

    const aLinesInHunk = hunk.filter((r) => r.a != null);
    const bLinesInHunk = hunk.filter((r) => r.b != null);
    const aCount = aLinesInHunk.length;
    const bCount = bLinesInHunk.length;
    // For a zero-count side (pure insert/delete) the standard header uses the line BEFORE the hunk,
    // i.e. the number of that side's lines preceding it — not a bare 0 (#1014-H). 0 only when the
    // hunk sits at the very start. Non-zero counts keep the first in-hunk line's own number.
    let aBefore = 0;
    let bBefore = 0;
    for (let i = 0; i < hs; i++) { if (rows[i].a != null) aBefore++; if (rows[i].b != null) bBefore++; }
    const aStart = aCount ? aLinesInHunk[0].a : aBefore;
    const bStart = bCount ? bLinesInHunk[0].b : bBefore;

    out.push(`@@ -${aStart},${aCount} +${bStart},${bCount} @@`);
    for (const r of hunk) out.push(r.tag + r.text);
  }
  return out.join('\n');
}

// ===== end jbcDiff (ES module) =====
// =====================================================================
// Diff Viewer — pure engine (DOM-free, exported, unit-testable).
//
// The Myers O(ND) diff engine (line-level, word-level, unified) now lives in the
// shared, Node-importable module lib/formats/CtDiff.mjs (promoted to jason-code,
// vendored here). This file imports it and re-exports its API, and keeps the
// tool-specific built-in SAMPLE_A / SAMPLE_B demo pair local. The unit tests load
// this module's namespace and the app inlines this file at build time, so the
// surface is unchanged; the build resolves the import and inlines the engine body
// (stripping each export) so the shipped index.html stays dependency-free.
// =====================================================================

// ---- built-in sample (Load sample button) ----------------------------
// A representative before/after pair chosen to exercise every kind of change
// the tool visualizes AND to make the ignore-* option toggles visibly matter.
// Kept here in the pure module so a unit test can assert it actually produces
// each kind. The lines, by design (whitespace shown with · below for the eye
// only — the strings hold real spaces/tabs):
//   - "Run the fast/slow tests" — a WORD-LEVEL (intra-line) edit.
//   - "Restart the SERVER/server" — differs ONLY by CASE (ignore case flips
//     it changed<->equal).
//   - "Clear the cache···" (trailing spaces) — trim OR ignore-all-ws flips it.
//   - "Notify··the team" (a run of internal double-spaces) — ONLY ignore-all-
//     whitespace flips it (trim leaves interior spacing alone).
//   - "\tCheck the logs" vs "    Check the logs" (tab vs spaces, leading) —
//     trim OR ignore-all-ws flips it.
//   - "Remove old feature flags" — a plain REMOVED line (A only).
//   - "Update the changelog" — a plain ADDED line (B only).
// With every ignore-* option OFF the middle five all read as CHANGED; turning
// the relevant option ON collapses its line(s) to EQUAL.
const SAMPLE_A = [
  'Deploy checklist',
  'Run the fast tests',
  '-----',
  'Restart the SERVER',
  'Clear the cache   ',
  'Notify  the team',
  '\tCheck the logs',
  '-----',
  'Remove old feature flags',
  'Ship it.',
  'All set.',
].join('\n');

const SAMPLE_B = [
  'Deploy checklist',
  'Run the slow tests',
  '-----',
  'Restart the server',
  'Clear the cache',
  'Notify the team',
  '    Check the logs',
  '-----',
  'Ship it.',
  'Update the changelog',
  'All set.',
].join('\n');


  // =====================================================================
  // 2. DOM references
  // =====================================================================
  const inputAEl = document.getElementById('inputA');
  const inputBEl = document.getElementById('inputB');
  const clearABtn = document.getElementById('clearABtn');
  const clearBBtn = document.getElementById('clearBBtn');
  const copyABtn = document.getElementById('copyABtn');
  const copyBBtn = document.getElementById('copyBBtn');
  const swapBtn = document.getElementById('swapBtn');
  const loadSampleBtn = document.getElementById('loadSampleBtn');

  const optTrimEl = document.getElementById('optTrim');
  const optAllWsEl = document.getElementById('optAllWs');
  const optCaseEl = document.getElementById('optCase');

  const viewSplitBtn = document.getElementById('viewSplitBtn');
  const viewInlineBtn = document.getElementById('viewInlineBtn');
  const copyUnifiedBtn = document.getElementById('copyUnifiedBtn');

  const statsEl = document.querySelector('[data-testid="stats"]');
  const warningEl = document.querySelector('[data-testid="size-warning"]');
  const splitEl = document.querySelector('[data-testid="diff-split"]');
  const inlineEl = document.querySelector('[data-testid="diff-inline"]');

  const helpButtonEl = document.getElementById('help-button');

  // =====================================================================
  // 3. State & persistence (single source of truth = the two inputs + opts +
  // view; the diff / stats / unified output are DERIVED and never stored)
  // =====================================================================
  const state = {
    view: 'split', // 'split' | 'inline'
    opts: {
      ignoreLeadingTrailingWhitespace: false,
      ignoreAllWhitespace: false,
      ignoreCase: false,
    },
  };

  const STORAGE_KEY = 'diff-viewer:v1';
  const HELP_SEEN_KEY = 'diff-viewer:help-seen:v1';
  const WARN_LINES = 8000; // soft warning threshold (total lines across A + B)


  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        textA: inputAEl.value,
        textB: inputBEl.value,
        view: state.view,
        opts: state.opts,
      }));
    } catch { /* best-effort; degrade to in-memory only */ }
  }

  function loadState() {
    const fallback = { textA: '', textB: '', view: 'split', opts: { ...state.opts } };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      const p = JSON.parse(raw) || {};
      const o = p.opts || {};
      return {
        textA: typeof p.textA === 'string' ? p.textA : '',
        textB: typeof p.textB === 'string' ? p.textB : '',
        view: p.view === 'inline' ? 'inline' : 'split',
        opts: {
          ignoreLeadingTrailingWhitespace: !!o.ignoreLeadingTrailingWhitespace,
          ignoreAllWhitespace: !!o.ignoreAllWhitespace,
          ignoreCase: !!o.ignoreCase,
        },
      };
    } catch { return fallback; }
  }

  // =====================================================================
  // 4. Rendering helpers (all user text via textContent — never innerHTML)
  // =====================================================================
  function makeGutter(n) {
    const g = document.createElement('div');
    g.className = 'gutter';
    g.textContent = n == null ? '' : String(n);
    return g;
  }

  function makeCode(text, extraClass) {
    const c = document.createElement('div');
    c.className = 'code' + (extraClass ? ' ' + extraClass : '');
    c.textContent = text;
    return c;
  }

  // A code cell whose changed segments (from diffWords) are wrapped in spans.
  function makeWordCode(segs, side /* 'del' | 'ins' */) {
    const c = document.createElement('div');
    c.className = 'code';
    const keep = side === 'del' ? 'delete' : 'insert';
    for (const seg of segs) {
      if (seg.type === 'equal') {
        c.appendChild(document.createTextNode(seg.text));
      } else if (seg.type === keep) {
        const span = document.createElement('span');
        span.className = side === 'del' ? 'wd-del' : 'wd-ins';
        span.textContent = seg.text;
        c.appendChild(span);
      }
      // the opposite side's segments are omitted from this cell
    }
    return c;
  }

  function emptyMessage(container, msg) {
    const d = document.createElement('div');
    d.className = 'diff-empty';
    d.textContent = msg;
    container.replaceChildren(d);
  }

  // ---- side-by-side ----
  function renderSplit(ops) {
    const frag = document.createDocumentFragment();
    let aNo = 0;
    let bNo = 0;

    const addRow = (rowClass, aN, aCell, bN, bCell) => {
      const row = document.createElement('div');
      row.className = 'diff-row' + (rowClass ? ' ' + rowClass : '');
      row.appendChild(makeGutter(aN));
      row.appendChild(aCell);
      row.appendChild(makeGutter(bN));
      row.appendChild(bCell);
      frag.appendChild(row);
    };

    for (const op of ops) {
      if (op.type === 'equal') {
        for (let i = 0; i < op.aLines.length; i++) {
          addRow('', ++aNo, makeCode(op.aLines[i]), ++bNo, makeCode(op.bLines[i]));
        }
      } else if (op.type === 'delete') {
        for (const l of op.aLines) {
          addRow('r-del', ++aNo, makeCode(l), null, makeCode('', 'cell-empty'));
        }
      } else if (op.type === 'insert') {
        for (const l of op.bLines) {
          addRow('r-add', null, makeCode('', 'cell-empty'), ++bNo, makeCode(l));
        }
      } else { // replace — align pairs, word-highlight, pad the shorter side
        const n = Math.max(op.aLines.length, op.bLines.length);
        for (let i = 0; i < n; i++) {
          const aHas = i < op.aLines.length;
          const bHas = i < op.bLines.length;
          if (aHas && bHas) {
            const segs = diffWords(op.aLines[i], op.bLines[i]);
            const row = document.createElement('div');
            row.className = 'diff-row r-chg';
            row.appendChild(makeGutter(++aNo));
            row.appendChild(makeWordCode(segs, 'del'));
            row.appendChild(makeGutter(++bNo));
            row.appendChild(makeWordCode(segs, 'ins'));
            frag.appendChild(row);
          } else if (aHas) {
            addRow('r-del', ++aNo, makeCode(op.aLines[i]), null, makeCode('', 'cell-empty'));
          } else {
            addRow('r-add', null, makeCode('', 'cell-empty'), ++bNo, makeCode(op.bLines[i]));
          }
        }
      }
    }
    splitEl.replaceChildren(frag);
  }

  // ---- inline / unified ----
  function renderInline(ops) {
    const frag = document.createDocumentFragment();
    let aNo = 0;
    let bNo = 0;

    const addRow = (rowClass, aN, bN, sign, cell) => {
      const row = document.createElement('div');
      row.className = 'diff-row' + (rowClass ? ' ' + rowClass : '');
      row.appendChild(makeGutter(aN));
      row.appendChild(makeGutter(bN));
      const s = document.createElement('div');
      s.className = 'sign';
      s.textContent = sign;
      row.appendChild(s);
      row.appendChild(cell);
      frag.appendChild(row);
    };

    for (const op of ops) {
      if (op.type === 'equal') {
        for (let i = 0; i < op.aLines.length; i++) {
          addRow('', ++aNo, ++bNo, ' ', makeCode(op.aLines[i]));
        }
      } else if (op.type === 'delete') {
        for (const l of op.aLines) addRow('r-del', ++aNo, null, '−', makeCode(l));
      } else if (op.type === 'insert') {
        for (const l of op.bLines) addRow('r-add', null, ++bNo, '+', makeCode(l));
      } else { // replace: deletes (word-highlighted) then inserts
        const n = Math.max(op.aLines.length, op.bLines.length);
        for (let i = 0; i < op.aLines.length; i++) {
          const cell = i < op.bLines.length
            ? makeWordCode(diffWords(op.aLines[i], op.bLines[i]), 'del')
            : makeCode(op.aLines[i]);
          addRow('r-del', ++aNo, null, '−', cell);
        }
        for (let i = 0; i < op.bLines.length; i++) {
          const cell = i < op.aLines.length
            ? makeWordCode(diffWords(op.aLines[i], op.bLines[i]), 'ins')
            : makeCode(op.bLines[i]);
          addRow('r-add', null, ++bNo, '+', cell);
        }
        void n;
      }
    }
    inlineEl.replaceChildren(frag);
  }

  // =====================================================================
  // 5. Stats + main render (derived on every change)
  // =====================================================================
  function renderStats(stats, hasInput, identical) {
    if (!hasInput) {
      statsEl.textContent = 'Enter text in A and B to compare.';
      return;
    }
    if (identical) {
      statsEl.textContent = 'No differences.';
      return;
    }
    statsEl.replaceChildren();
    const add = document.createElement('span');
    add.className = 's-add';
    add.textContent = `${stats.added} added`;
    const del = document.createElement('span');
    del.className = 's-del';
    del.textContent = `${stats.removed} removed`;
    const chg = document.createElement('span');
    chg.className = 's-chg';
    chg.textContent = `${stats.changed} changed`;
    statsEl.append(add, document.createTextNode(' · '), del, document.createTextNode(' · '), chg);
  }

  let lastUnified = '';

  // In-field copy buttons (controls.css § in-field copy): reveal only when the
  // textarea is non-empty so an icon never floats over placeholder text.
  function syncCopyButtons() {
    copyABtn.hidden = inputAEl.value === '';
    copyBBtn.hidden = inputBEl.value === '';
  }

  function render() {
    const a = inputAEl.value;
    const b = inputBEl.value;
    const hasInput = a !== '' || b !== '';

    // soft large-input warning
    const totalLines = splitLines(a).length + splitLines(b).length;
    if (totalLines > WARN_LINES) {
      warningEl.hidden = false;
      warningEl.textContent = `Large input (${totalLines.toLocaleString()} lines) — the diff may take a moment.`;
    } else {
      warningEl.hidden = true;
      warningEl.textContent = '';
    }

    const { ops, stats } = diffLines(a, b, state.opts);
    const identical = hasInput && stats.added === 0 && stats.removed === 0 && stats.changed === 0;

    renderStats(stats, hasInput, identical);

    if (!hasInput) {
      emptyMessage(splitEl, 'The side-by-side diff will appear here.');
      emptyMessage(inlineEl, 'The inline diff will appear here.');
    } else if (identical) {
      emptyMessage(splitEl, 'The two texts are identical under the current options.');
      emptyMessage(inlineEl, 'The two texts are identical under the current options.');
    } else {
      if (state.view === 'split') {
        renderSplit(ops);
        emptyMessage(inlineEl, '');
      } else {
        renderInline(ops);
        emptyMessage(splitEl, '');
      }
    }

    lastUnified = hasInput ? toUnifiedDiff(a, b, state.opts, { aName: 'A', bName: 'B' }) : '';
    copyUnifiedBtn.disabled = lastUnified === '';
    syncCopyButtons();
  }

  // Shared trailing-edge debounce (lib/util.js, inlined as a global).

  inputAEl.addEventListener('input', () => { syncCopyButtons(); debouncedRender(); debouncedSave(); });
  inputBEl.addEventListener('input', () => { syncCopyButtons(); debouncedRender(); debouncedSave(); });

  // ---- in-field copy (A / B) ----

  copyBBtn.addEventListener('click', async () => {

  // =====================================================================

  // =====================================================================
  // 10. Help modal — the shared jbcModal primitive (lib/components/CtModal.mjs), built
  // from the hidden #help-body template. Focus-trap / Esc + backdrop close /
  // focus-return / reduced-motion / scroll-top live in that primitive.
  // `testid: 'help'` keeps the help-overlay / help-modal / modal-close-x hooks;
  // `titleId` pins aria-labelledby; `autoOpen` rides the shared onceFlag
  // so it auto-shows once on a fresh visit and never again.
  // =====================================================================
  const help = createModal({
    testid: 'help',
    titleId: 'help-title',
    title: 'How Visual Diff works',
    body: document.getElementById('help-body').content.cloneNode(true),
    autoOpen: onceFlag(HELP_SEEN_KEY),
  });
  helpButtonEl.addEventListener('click', () => help.open());

  // =====================================================================
  // 11. Init
  // =====================================================================
  function setInputs(a, b) {
    inputAEl.value = a == null ? '' : String(a);
    inputBEl.value = b == null ? '' : String(b);
    render();
    saveState();
  }

  (function init() {
    const loaded = loadState();
    inputAEl.value = loaded.textA;
    inputBEl.value = loaded.textB;
    state.opts = loaded.opts;
    optTrimEl.checked = loaded.opts.ignoreLeadingTrailingWhitespace;
    optAllWsEl.checked = loaded.opts.ignoreAllWhitespace;
    optCaseEl.checked = loaded.opts.ignoreCase;
    syncOptionDisabled();
    readOptions(); // reconcile (all-ws subsumes trim)
    viewSeg.select(loaded.view === 'inline' ? 'inline' : 'split'); // sets aria, then setView (render)
    // The Help modal auto-shows once on a fresh visit via jbcModal's autoOpen.
  })();

  // =====================================================================
  // 12. Test hook — inert namespace for Playwright-driven tests
  // =====================================================================
  window.__diffViewer = {
    // pure functions
    diffLines,
    diffWords,
    toUnifiedDiff,
    splitLines,
    normalizeLine,
    myersDiff,
    tokenizeWords,
    // deterministic entry points
    setInputs,
    setView: (v) => viewSeg.select(v === 'inline' ? 'inline' : 'split'),
    setOption,
    render,
    loadSample,
    // sample data
    SAMPLE_A,
    SAMPLE_B,
    // live state
    state,
  };
</script>
</body>
</html>
