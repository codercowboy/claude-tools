<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty-Printer &amp; Minifier</title>
<meta property="og:title"       content="Pretty-Printer & Minifier">
<meta property="og:description" content="Pretty-print and minify JSON, YAML, HTML, CSS, SQL, and JavaScript — hand-rolled, dependency-free, entirely in your browser.">
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="claude-tools">
<meta property="og:image"       content="preview.png">
<meta name="twitter:card"       content="summary_large_image">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d7d7dc;
    --border-strong: #b6b6bd;
    --text: #1c1c1f;
    --text-muted: #6b6b74;
    --accent: #2f6fed;
    --accent-contrast: #ffffff;
    --danger: #c4362a;
    --danger-bg: #fdeceb;
    --focus: #2f6fed;
    --radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* confirmDialog theming — reuse this tool's tokens (docs/conventions.md) */
    --ctc-accent: var(--accent);
    --ctc-accent-fg: var(--accent-contrast);
    --ctc-bg: var(--panel);
    --ctc-fg: var(--text);
    --ctc-radius: var(--radius);
    --ctc-btn-radius: var(--radius);
    --ctc-focus: var(--focus);
    --ctc-cancel-border: var(--border-strong);

    /* jbcModal (Help dialog) theming — reuse this tool's tokens (they redefine
       per theme, so this one block covers light + dark). */
    --jbcm-bg: var(--panel);
    --jbcm-fg: var(--text);
    --jbcm-border: var(--border);
    --jbcm-radius: var(--radius);
    --jbcm-focus: var(--focus);
    --jbcm-max-width: 34rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #17171a;
      --panel: #202024;
      --border: #34343a;
      --border-strong: #46464d;
      --text: #eceef1;
      --text-muted: #9a9aa2;
      --accent: #6d9bff;
      --accent-contrast: #0b1220;
      --danger: #ff6b60;
      --danger-bg: #3a1815;
      --focus: #6d9bff;
    }
  }

  * { box-sizing: border-box; }

  <<ct:lib components/styles/base.css>><<ct:lib components/styles/controls.css>><<ct:inline styles.css>></style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-row">
      <div class="header-titles">
        <h1>Pretty-Printer &amp; Minifier</h1>
        <p class="subtitle">Format or minify JSON, YAML, HTML, CSS, SQL, and JavaScript — all hand-rolled, all local, nothing leaves your browser.</p>
      </div>
      <button
        id="help-button"
        type="button"
        class="help-button"
        data-testid="help-button"
        title="How it works"
        aria-label="How it works"
      >?</button>
    </div>
  </header>

  <div class="tablist" role="tablist" aria-label="Language" data-testid="tablist">
    <button type="button" role="tab" id="tab-json" data-testid="tab-json" data-lang="json" data-value="json" aria-selected="true"  aria-controls="panel-editor" tabindex="0">JSON</button>
    <button type="button" role="tab" id="tab-yaml" data-testid="tab-yaml" data-lang="yaml" data-value="yaml" aria-selected="false" aria-controls="panel-editor" tabindex="-1">YAML</button>
    <button type="button" role="tab" id="tab-html" data-testid="tab-html" data-lang="html" data-value="html" aria-selected="false" aria-controls="panel-editor" tabindex="-1">HTML</button>
    <button type="button" role="tab" id="tab-css"  data-testid="tab-css"  data-lang="css"  data-value="css"  aria-selected="false" aria-controls="panel-editor" tabindex="-1">CSS</button>
    <button type="button" role="tab" id="tab-sql"  data-testid="tab-sql"  data-lang="sql"  data-value="sql"  aria-selected="false" aria-controls="panel-editor" tabindex="-1">SQL</button>
    <button type="button" role="tab" id="tab-js"   data-testid="tab-js"   data-lang="js"   data-value="js"   aria-selected="false" aria-controls="panel-editor" tabindex="-1">JavaScript</button>
  </div>

  <div class="controls" role="group" aria-label="Options">
    <div class="mode-toggle" role="group" aria-label="Mode">
      <button type="button" id="mode-format" data-testid="mode-format" data-value="format" aria-pressed="true">Format</button>
      <button type="button" id="mode-minify" data-testid="mode-minify" data-value="minify" aria-pressed="false">Minify</button>
    </div>

    <div class="control-field" data-testid="indent-field">
      <label for="indent-select">Indent</label>
      <select id="indent-select" data-testid="indent-select" aria-label="Indent size">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>

    <div class="control-field" data-testid="sql-case-field" hidden>
      <label for="sql-keyword-case">Keywords</label>
      <select id="sql-keyword-case" data-testid="sql-keyword-case" aria-label="SQL keyword case">
        <option value="unchanged" selected>Unchanged</option>
        <option value="upper">UPPERCASE</option>
        <option value="lower">lowercase</option>
      </select>
    </div>

    <div class="controls-spacer"></div>

    <button type="button" id="load-sample" data-testid="load-sample">Load sample</button>
    <button type="button" id="clear-input" data-testid="clear-input">Clear</button>
  </div>

  <div class="editor" id="panel-editor" role="tabpanel" aria-labelledby="tab-json" data-testid="editor">
    <section class="panel">
      <div class="panel-header">
        <label for="pp-input" id="input-label">Input</label>
        <span class="meta" data-testid="input-bytes" aria-live="off"></span>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="pp-input" data-testid="pp-input" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder="Paste or type code, then pick Format or Minify…" aria-labelledby="input-label"></textarea>
        <button type="button" id="copy-input" class="ct-copy-btn" data-testid="copy-input" aria-label="Copy input" title="Copy input" hidden>📋</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <label for="pp-output">Output</label>
        <p class="stats" data-testid="pp-stats" aria-live="polite"></p>
      </div>
      <div class="ct-field ct-field--multiline">
        <textarea id="pp-output" data-testid="pp-output" readonly spellcheck="false" aria-label="Output"></textarea>
        <button type="button" id="copy-output" class="ct-copy-btn" data-testid="copy-output" aria-label="Copy output" title="Copy output">📋</button>
      </div>
    </section>
  </div>

  <p class="error" data-testid="pp-error" role="alert" aria-live="polite" hidden></p>
</div>

<!-- Help modal is built at runtime by the shared jbcModal primitive
     (CtModal in the shared lib) from this hidden template. The <h2> title is
     supplied via jbcModal's `title` option, so it is not repeated here. -->
<template id="help-body">
    <p>Pick a language tab, paste your code into the <strong>Input</strong> box up top, and choose <strong>Format</strong> (pretty-print) or <strong>Minify</strong>. The <strong>Output</strong> updates live in the taller box below. Everything runs locally — nothing you paste is ever sent anywhere.</p>

    <h3>Six languages</h3>
    <ul>
      <li><strong>JSON</strong> — full pretty-print and minify (via a strict parse + re-serialize).</li>
      <li><strong>YAML</strong> — a practical common subset (block mappings/sequences, scalars, flow collections, comments). Anchors, aliases, tags, complex keys, block scalars and multi-document streams are rejected with a clear message rather than mis-parsed. Comments are dropped.</li>
      <li><strong>HTML</strong> — re-indent the element tree; <code>&lt;script&gt;</code>, <code>&lt;style&gt;</code>, <code>&lt;pre&gt;</code> and <code>&lt;textarea&gt;</code> contents are kept verbatim. Minify is conservative because HTML whitespace can be significant.</li>
      <li><strong>CSS</strong> — full pretty-print and minify, aware of strings, comments and <code>url()</code>.</li>
      <li><strong>SQL</strong> — reliable pretty-print (with keyword casing) plus a <em>safe</em> minify (strip comments, collapse whitespace). Token-based, string/identifier/comment aware.</li>
      <li><strong>JavaScript</strong> — reliable pretty-print plus a <em>safe</em> minify. Fully aware of strings, template literals (incl. nested <code>${…}</code>), regex-vs-division, and comments. No renaming, no dead-code removal.</li>
    </ul>

    <h3>Safe by design</h3>
    <p>For JS and SQL the tool only strips comments and insignificant whitespace — it never renames identifiers or rewrites your code, and it stays conservative around automatic semicolon insertion. The overriding rule everywhere: the output is always semantically equivalent to the input.</p>

    <p class="help-note">Your active tab, mode, indent, SQL keyword case, and the text for each language are remembered on this device. Output is always recomputed, never stored.</p>
</template>

<<ct:lib components/footer.html>>




<script type="module"><<ct:inline app.mjs>></script>
</body>
</html>
