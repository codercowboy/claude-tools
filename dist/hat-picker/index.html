/* ---- In-field copy button ----
   Wrap a value field in `.ct-field` (position:relative). The field reserves
   right padding so its text never runs under the icon; the copy <button> is

  /* ---- Custom properties: palette / sizing ---- */
  :root {

    --ctc-accent-fg: #ffffff;
    --ctc-bg: var(--bg-alt);
    --ctc-fg: var(--ink);
    --ctc-radius: var(--radius);
    --ctc-btn-radius: var(--radius-sm);
    --ctc-focus: var(--focus-ring);
    --ctc-cancel-border: var(--border);

    /* jbcModal (Help dialog) theming — reuse this tool's tokens */

    --jbcm-fg: var(--ink);
    --jbcm-border: var(--border);
    --jbcm-radius: var(--radius);
    --jbcm-shadow: var(--shadow);
    --jbcm-backdrop: rgba(44, 42, 74, 0.55);

  * { box-sizing: border-box; }

  html, body {

    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    padding: 24px 16px 64px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ---- Focus visibility (never remove outline outright) ---- */

  input:focus-visible {

    display: flex;
    flex-direction: column;

  header.app-header h1 {
    margin: 0;
    font-size: 2.1rem;

  }
  header.app-header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  /* A spacer that mirrors the help button's width keeps the title block
     visually centered instead of the button pulling it off-center. */
  .app-header-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .header-spacer,
  .help-button {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
  }
  .header-titles {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .help-button {
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg-alt);
    color: var(--ink);
    font-size: 1.2rem;
    font-weight: 800;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .help-button:hover:not(:disabled) {
    background: var(--bg);
  }

  /* ---- Shared card look ---- */
  section.card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* ---- Add row ---- */
  .add-row form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .add-row .field-wrap {
    flex: 1 1 220px;
    min-width: 0;
  }
  /* .visually-hidden now comes from the pasted ct-base include above. */
  #entry-input {
    width: 100%;
    font-size: 1.05rem;
    /* Vertical padding matches the buttons so the shared --control-h (44px,
       via controls.css) resolves to the same rendered height across the row. */
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    /* Height is standardized by controls.css (--control-h: 44px); no per-tool
       min-height here. */
    /* Removes the mobile browser's tap-to-zoom gesture ambiguity/delay on
       this control — matches the button rule below. No effect on desktop
       mouse input. */
    touch-action: manipulation;
  }
  #entry-input.shake {
    animation: shake 320ms ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 700;
    /* Height is standardized by controls.css (--control-h: 44px). */
    padding: 10px 18px;
    transition: transform 120ms ease, opacity 120ms ease, filter 120ms ease;
    /* Tells mobile browsers this control only needs tap/pan-through, not
       double-tap-to-zoom — removes any residual gesture-recognition delay
       or ambiguity on a real touch device before the click is dispatched.
       No visible/behavioral effect on desktop (mouse) input. */
    touch-action: manipulation;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  #add-button {
    background: var(--accent);
    color: #04302c;
    font-size: 1.05rem;
    padding: 10px 22px;
  }
  #add-button:hover:not(:disabled) { filter: brightness(1.05); }

    margin-top: 8px;
    display: flex;
    justify-content: flex-end;
  }

    font-weight: 700;

  }

    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 340px;
    overflow-y: auto;
  }

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  li[data-testid="entry-row"] .entry-text {
    word-break: break-word;
    font-size: 1rem;
  }
  button[data-testid="entry-remove"] {
    background: transparent;
    color: var(--danger);
    font-size: 1.2rem;
    line-height: 1;
    /* min-height comes from controls.css (--control-h: 44px). */
    min-width: 44px;
    padding: 0;
    border-radius: 50%;
    flex-shrink: 0;
  }
  button[data-testid="entry-remove"]:hover:not(:disabled) {
    background: #fbe4e0;
  }
  #empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 24px 8px;
    font-size: 1rem;
  }

  /* ---- Draw area ---- */
  .draw-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  #pull-button, #draw-again-button {
    font-size: 1.35rem;
    padding: 18px 32px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    box-shadow: 0 8px 20px rgba(224, 85, 63, 0.35);
    width: 100%;
    max-width: 380px;
  }
  #pull-button:hover:not(:disabled), #draw-again-button:hover:not(:disabled) {
    filter: brightness(1.06);
  }
  #pull-button:disabled, #draw-again-button:disabled {
    box-shadow: none;
  }

  .draw-controls-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    min-height: 44px;
  }
  .toggle-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent-dark);
  }
  .toggle-row label {
    /* Vertical padding widens the tappable area around the checkbox's text
       label toward the ~44px guideline without inflating the checkbox
       itself (a native checkbox rendered oversized looks odd). */
    padding: 12px 0;
    cursor: pointer;
  }

  #clear-all {
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    padding: 8px 16px;
    /* min-height comes from controls.css (--control-h: 44px). */
  }
  #clear-all:hover:not(:disabled) {
    background: #fbe4e0;
  }

  /* ---- Winner card ---- */
  .winner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-height: 140px;
    justify-content: center;
  }
  /* In-field copy button lives inside this wrapper (controls.css supplies the
     .ct-field / .ct-copy-btn base; --multiline pins the button to the top-right).
     The winner value is copy-worthy, so the button reveals once a winner is
     shown (app.mjs toggles [hidden]); it's hidden in the idle placeholder
     state. Reserve top-right room so a long revealed value can't run under the
     icon. */
  .winner-field {
    width: 100%;
  }
  .winner-card {
    width: 100%;
    background: linear-gradient(135deg, #fff7ea, #fff0dc);
    border: 2px dashed var(--brand);
    border-radius: var(--radius);
    padding: 24px 16px;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--ink);
    word-break: break-word;
  }
  .winner-card.bounce {
    animation: winner-bounce 420ms ease-out;
  }
  @keyframes winner-bounce {
    0%   { transform: scale(0.8); }
    50%  { transform: scale(1.12); }
    75%  { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .winner-hint {
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  /* ---- Confetti canvas ---- */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  /* ---- Help modal content ----
     The dialog chrome (overlay, surface, ✕, fade, focus-trap) is the shared

  .jbcm-body li { margin-bottom: 0.35rem; }
  .help-note {
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 0.88rem;
  }

  @media (max-width: 420px) {
    header.app-header h1 { font-size: 1.7rem; }
    .winner-card { font-size: 1.3rem; }
    #pull-button, #draw-again-button { font-size: 1.15rem; padding: 16px 24px; }
  }

<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-row">
        <span class="header-spacer" aria-hidden="true"></span>
        <div class="header-titles">
          <h1>🎩 Hat Picker</h1>
          <p>Add some ideas, pull one from the hat!</p>
        </div>
        <button
          id="help-button"
          type="button"
          class="help-button"
          data-testid="help-button"
          title="How it works"
          aria-label="How it works"
        >?</button>
      </div>
    </header>

    <section class="add-row card">
      <form id="add-form">
        <div class="field-wrap">
          <label class="visually-hidden" for="entry-input">Add a suggestion</label>
          <input
            id="entry-input"
            type="text"
            data-testid="entry-input"
            maxlength="80"
            placeholder="Type a game, activity, or idea…"
            aria-describedby="char-counter"
            autocomplete="off"
          />
        </div>
        <button id="add-button" type="submit" data-testid="add-button">Add</button>
      </form>
      <div class="add-row-meta">
        <span id="char-counter" data-testid="char-counter">0 / 80</span>
      </div>
    </section>

    <section class="entries card">
      <div class="entries-head">
        <h2>In the hat</h2>
        <span id="entry-count" data-testid="entry-count">0 in the hat</span>
      </div>
      <ul id="entry-list" data-testid="entry-list"></ul>
      <p id="empty-state" data-testid="empty-state">
        Nothing in the hat yet — add a few suggestions above!
      </p>
    </section>

    <section class="draw-area card">
      <button id="pull-button" data-testid="pull-button" type="button" disabled>
        Pull from the hat! 🎩
      </button>
      <button id="draw-again-button" data-testid="draw-again-button" type="button" hidden>
        Draw again 🎲
      </button>
      <div class="draw-controls-row">
        <span class="toggle-row">
          <input
            id="remove-winner-toggle"
            type="checkbox"
            data-testid="remove-winner-toggle"
          />
          <label for="remove-winner-toggle">Remove winner after draw</label>
        </span>
        <button id="clear-all" data-testid="clear-all" type="button">Clear all</button>
      </div>
    </section>

    <section class="winner">
      <div class="ct-field ct-field--multiline winner-field">
        <div id="winner-reveal" class="winner-card" data-testid="winner-reveal" aria-hidden="true">
          Ready when you are!
        </div>
        <button
          type="button"
          id="winner-copy"
          class="ct-copy-btn"
          data-testid="winner-copy"
          title="Copy winner"
          aria-label="Copy winner"
          hidden
        >📋</button>
      </div>
      <p class="winner-hint">The winner will appear here.</p>
      <div id="winner-announce" data-testid="winner-announce" aria-live="polite" class="visually-hidden"></div>
    </section>
  </div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Help modal is built at runtime by the shared jbcModal primitive
       (CtModal.mjs) from this hidden template. The <h2> title is
       supplied via jbcModal's `title` option, so it is not repeated here. -->
  <template id="help-body">
    <p>Type a name, activity, or idea into the box and tap <strong>Add</strong> to drop it in the hat. Add as many entries as you like — blank and duplicate entries are rejected (the box shakes to let you know).</p>
    <ul>
      <li><strong>Pull from the hat!</strong> Once there are at least two entries, this runs a slot-machine-style animation that lands on a random winner, with a confetti burst to celebrate. (If your device prefers reduced motion, the winner appears instantly instead.)</li>
      <li><strong>Draw again.</strong> After a winner is revealed, the button becomes "Draw again" so you can keep pulling from the same hat.</li>
      <li><strong>Remove winner after draw.</strong> Turn this on to automatically take the winning entry out of the hat once it's picked — handy for making sure everyone gets picked exactly once.</li>
      <li><strong>Remove an entry (×).</strong> Takes a single entry out of the hat. Asks you to confirm first, since it can't be undone.</li>
      <li><strong>Clear all.</strong> Empties the whole hat at once. Also asks you to confirm first.</li>
    </ul>
    <p class="help-note">Your entries and the "Remove winner after draw" setting are saved on this device, so they're still here next time you open Hat Picker.</p>
  </template>

/*
 * CtClipboardUtil — copy-to-clipboard + button-flash helpers (ES module; was copy.js)
 * ---------------------------------------------------------------------------
 * import { copy, flash } from '<rel>/jbc-include/components/CtClipboardUtil.mjs';
 * (or `CtClipboardUtil.copy` / `CtClipboardUtil.flash` via the aggregator class
 * at the bottom — statics REFERENCE the named bindings, single implementation.)
 *
 * Formerly the pasteable IIFE copy.js exposing the jbcCopy / jbcFlash window globals;
 * those globals are GONE. `copy` = ex-jbcCopy, `flash` = ex-jbcFlash — bodies
 * unchanged. The `.ctc-flash` CSS still self-injects on the first `flash()` call
 * (ensureStyles) and the `window.ctCopyStyles = false` opt-out is still honored.
 *
 * copy(text) -> Promise<boolean>
 * flash(el, opts?) -> void
 *
 *     btn.addEventListener('click', async () => {
 *       if (!text) return;
 *       const ok = await copy(text);
 *       if (!ok) return;
 *       flash(btn, { label: '✅', revertTo: '📋' });
 *     });
 *
 * copy(text):
 * - Tries `navigator.clipboard.writeText` first; falls back to a hidden,
 *   off-screen `<textarea>` + `document.execCommand('copy')` for restricted
 *   or insecure contexts (e.g. `file://`, LAN HTTP) where the async
 *   Clipboard API is unavailable or denied.
 * - Always RESOLVES — never rejects/throws. Resolves `true` on success,
 *   `false` if every copy path failed (denied permission, unsupported
 *   browser, etc.) — callers check the boolean rather than try/catch.
 *
 * flash(el, opts?):
 * - Transient "copied" feedback on a button: swaps `el.textContent` to
 *   `opts.label` (default `'✅'`) for `opts.ms` (default `1000`), then
 *   reverts and clears the timer.
 * - Revert target: `opts.revertTo` if given (for icon-only buttons that
 *   always revert to a fixed glyph, e.g. `'📋'`); otherwise the element's
 *   current text — captured once and reused if `flash` is called again on
 *   the same element before the previous flash reverted (rapid re-clicks
 *   don't lose the true original label).
 * - Adds a `.ctc-flash` class for the duration, driving a brief, purely
 *   decorative scale pulse (see STYLING below) — no functional behavior
 *   depends on it.
 *
 * STYLING:
 * - The only visual injected is the optional `.ctc-flash` pulse animation,
 *   which is skipped entirely under `prefers-reduced-motion: reduce` (the
 *   text swap + revert timing are unaffected either way).
 * - Full opt-out: set `window.ctCopyStyles = false` BEFORE the first
 *   `flash` call and no styles are injected.
 *
 * This is a shared component inlined by the build (import-inlining; no globals).
 * Edit here and run `npm run build` — every tool picks it up; there is no hash
 * to recompute. Canonical source:
 * html-single-file/assets/components/CtClipboardUtil.mjs
 */


function copy(text) {
  text = String(text == null ? '' : text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(
      function () { return true; },
      function () { return fallbackCopy(text); }
    );
  }
  return Promise.resolve(fallbackCopy(text));
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* unsupported */ }
  document.body.removeChild(ta);
  return ok;
}

var STYLE_ID = 'ctc-copy-style';
function ensureStyles() {
  if (window.ctCopyStyles === false) return; // tool supplies its own CSS
  if (document.getElementById(STYLE_ID)) return;
  var style = document.createElement('style');
  style.id = STYLE_ID;
  style.textContent = [
    '@keyframes ctc-flash-pulse{0%{transform:scale(1);}',
    '30%{transform:scale(1.12);}100%{transform:scale(1);}}',
    '.ctc-flash{animation:ctc-flash-pulse 300ms ease;}',
    '@media (prefers-reduced-motion: reduce){.ctc-flash{animation:none;}}'
  ].join('');
  document.head.appendChild(style);
}

var flashTimeouts = new WeakMap();
function flash(el, opts) {
  opts = opts || {};
  var ms = opts.ms != null ? opts.ms : 1000;
  var label = opts.label != null ? opts.label : '✅';

  ensureStyles();
  clearTimeout(flashTimeouts.get(el));

  var original;
  if (opts.revertTo != null) {
    original = opts.revertTo;
  } else if (el.dataset.ctcFlashOriginal != null) {
    original = el.dataset.ctcFlashOriginal; // already mid-flash; keep true original
  } else {
    original = el.textContent;
  }
  el.dataset.ctcFlashOriginal = original;

  el.textContent = label;
  el.classList.remove('ctc-flash');
  void el.offsetWidth; // restart the CSS animation even on rapid re-clicks
  el.classList.add('ctc-flash');

  var t = setTimeout(function () {
    el.textContent = original;
    el.classList.remove('ctc-flash');
    delete el.dataset.ctcFlashOriginal;
    flashTimeouts.delete(el);
  }, ms);
  flashTimeouts.set(el, t);
}

/** Aggregator (decision #3): statics REFERENCE the named exports above. */
class CtClipboardUtil {
  static copy = copy;
  static flash = flash;

 *   - close()  hide it (restores focus to the trigger, runs onClose)
 *   - root     the overlay element; `root.querySelector('.jbcm-body')` is the
 *              content container if you want to swap `body` between opens.
 *
 * Options:
 *   - title    heading text; renders an <h2> and wires `aria-labelledby`.
 *              Omit it and the dialog is labelled `aria-label="Dialog"`.
 *   - titleId  explicit id for that <h2> (and the `aria-labelledby` it wires).
 *              Default: a random id. Pass a stable one when a test or another
 *              element references it (e.g. `titleId: 'help-title'`).

 *              to start empty and fill `.jbcm-body` yourself.
 *   - onClose  called (no args) after each close — handy for a "seen" flag.
 *   - testid   `data-testid` prefix for stable test hooks: the overlay gets
 *              `${testid}-overlay`, the dialog `${testid}-modal` (default:
 *              `jbcm-overlay` / `jbcm-dialog`). The ✕ is always `modal-close-x`.
 *   - autoOpen the FIRST-LOAD variant: a once-flag handle `{ seen(), mark() }`
 *              (e.g. `CtUtil's onceFlag(KEY)`). On a genuinely fresh visit
 *              (`seen()` false) the modal auto-opens and marks the flag, so it
 *              shows exactly once and never again — the first-load Help popup.
 *              Injected (not a hard CtUtil dependency) so this stays standalone.

 *   - role="dialog", aria-modal="true", labelled by the title.
 *   - A persistent close ✕ pinned to the dialog's top-right corner — always
 *     reachable even when the content scrolls; it is the sole dedicated close
 *     affordance (no redundant bottom "Close").
 *   - Initial focus moves to the ✕; a focus trap cycles Tab / Shift+Tab over
 *     the ✕ plus any content controls and wraps at both ends.
 *   - Esc and backdrop-click close; focus returns to the triggering element.
 *   - Scrolls to the top on open; reduced-motion aware (no fade when the
 *     visitor asked for less motion).

 *     subtree, so on open the overlay is re-parented into

 *   no theming AND matches your tool if you set a few variables anywhere in
 *   scope (e.g. your :root / body theme block):

 *     --jbcm-backdrop                  (overlay behind the dialog)
 *     --jbcm-border, --jbcm-shadow      (dialog border + shadow)
 *     --jbcm-radius                    (corner rounding)

 *   and NO styles are injected — your tool then supplies all `.jbcm-*` CSS

 *
 * Formerly the pasteable IIFE modal.js exposing the old `jbcModal` window global;
 * that global is GONE — `createModal` = ex-jbcModal, body unchanged. The CSS
 * still self-injects on the first createModal() call (ensureModalStyles) and the

 * Edit here and run `npm run build` — every tool picks it up; there is no hash

 * html-single-file/assets/components/CtModal.mjs

function createModal(opts) {
  opts = opts || {};
  ensureModalStyles();

  var prevFocus = null;
  var titleId = (opts.titleId != null && String(opts.titleId) !== '')
    ? String(opts.titleId)
    : 'jbcm-title-' + Math.random().toString(36).slice(2);
  var tidPrefix = (opts.testid != null && String(opts.testid) !== '') ? String(opts.testid) : null;

  var overlay = document.createElement('div');
  overlay.className = 'jbcm-overlay';
  overlay.hidden = true;
  overlay.setAttribute('data-testid', tidPrefix ? tidPrefix + '-overlay' : 'jbcm-overlay');

  dialog.className = 'jbcm-dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('data-testid', tidPrefix ? tidPrefix + '-modal' : 'jbcm-dialog');

  closeBtn.type = 'button';
  closeBtn.className = 'jbcm-close';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.setAttribute('title', 'Close');
  closeBtn.setAttribute('data-testid', 'modal-close-x');
  closeBtn.innerHTML = '&times;';
  dialog.appendChild(closeBtn);

  if (opts.title != null && String(opts.title) !== '') {
    var titleEl = document.createElement('h2');
    titleEl.className = 'jbcm-title';
    titleEl.id = titleId;
    titleEl.textContent = String(opts.title);
    dialog.appendChild(titleEl);
    dialog.setAttribute('aria-labelledby', titleId);
  } else {
    dialog.setAttribute('aria-label', 'Dialog');
  }

  var bodyEl = document.createElement('div');
  bodyEl.className = 'jbcm-body';
  if (opts.body != null) {
    if (typeof opts.body === 'string') bodyEl.innerHTML = opts.body;
    else if (opts.body.nodeType) bodyEl.appendChild(opts.body);
  }
  dialog.appendChild(bodyEl);

  overlay.appendChild(dialog);
  // Present-but-hidden from construction (not lazily on first open): the
  // overlay is queryable immediately and its `[hidden]` collapses it to
  // display:none, matching the semantics of a statically-authored modal.
  if (document.body) document.body.appendChild(overlay);

  function focusables() {
    return Array.prototype.slice
      .call(dialog.querySelectorAll(
        'button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])'))
      .filter(function (el) { return !el.disabled && el.getClientRects().length > 0; });
  }

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    var f = focusables();
    if (!f.length) return;
    e.preventDefault();
    var i = f.indexOf(document.activeElement);
    var n = e.shiftKey ? i - 1 : i + 1;
    if (n < 0) n = f.length - 1;
    if (n >= f.length) n = 0;
    f[n].focus();
  }

  function open() {
    if (!overlay.parentNode) document.body.appendChild(overlay);
    prevFocus = document.activeElement;
    // Fullscreen-safe: the browser only renders the fullscreen element's subtree.
    var host = document.fullscreenElement || document.body;
    if (overlay.parentNode !== host) host.appendChild(overlay);
    overlay.hidden = false;
    document.addEventListener('keydown', onKey, true);
    dialog.scrollTop = 0;
    closeBtn.focus({ preventScroll: true });
  }

  function close() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    document.removeEventListener('keydown', onKey, true);
    if (overlay.parentNode !== document.body) document.body.appendChild(overlay);
    if (prevFocus && typeof prevFocus.focus === 'function') {
      try { prevFocus.focus(); } catch (e) { /* ignore */ }
    }
    prevFocus = null;
    if (typeof opts.onClose === 'function') opts.onClose();
  }

  closeBtn.addEventListener('click', close);
  overlay.addEventListener('mousedown', function (e) {
    if (e.target === overlay) { e.preventDefault(); close(); }
  });

  // First-load variant: auto-open ONCE, gated by an injected once-flag handle
  // (e.g. CtUtil's onceFlag(KEY)). Mark seen BEFORE opening so it stays a true
  // "once" even if the visitor navigates away without closing — never again.
  var once = opts.autoOpen;
  if (once && typeof once.seen === 'function' && !once.seen()) {
    if (typeof once.mark === 'function') once.mark();
    open();
  }

  return { open: open, close: close, root: overlay };
}

 * by hand. `opts.cap` (a number) caps the length; omitted / null leaves it
 * UNCAPPED (text-toolkit's slug is uncapped).
 *
 * Node-importable ES module. A tool whose pure, unit-tested source/logic.mjs
 * needs a slug imports this module directly (so `node --test` can load it); the
 * single-file build inlines this module body into the shipped index.html —
 * stripping the `export` — so the shipped tool stays dependency-free and
 * file://-openable. See the consuming repo's build docs (§ "Build-assembled
 * tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function slugify(str, opts) {
  opts = opts || {};
  if (opts.diacritics) {
    if (str == null) return '';
    const stripped = String(str).normalize('NFKD').replace(/[̀-ͯ]/g, '');
    const words = stripped.match(/[A-Z]+(?=[A-Z][a-z])|[A-Z][a-z]+|[A-Z]+|[a-z]+|[0-9]+/g) || [];
    const slug = words.map((w) => w.toLowerCase()).join('-');
    // Strip a trailing hyphen the cap may have left mid-separator (#1014-O).
    return opts.cap == null ? slug : slug.slice(0, opts.cap).replace(/-+$/g, '');
  }
  return String(str == null ? '' : str)
    .trim()
    .toLowerCase()
    .replace(/['"]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60)
    .replace(/-+$/g, ''); // the 60-char cap can land mid-separator, re-stripping a trailing hyphen (#1014-O)
}

// =====================================================================
// Section: wrapText  (was wrapText.mjs — jbcWrapText)
// =====================================================================
/*
 * wrapText(text, maxWidth, measure) -> string[]
 * ---------------------------------------------------------------------------
 * Greedy word-wrap of `text` to a maximum width, returning an array of lines
 * (always at least one, possibly `''`). Explicit newlines are honored as hard
 * breaks first; within a paragraph, words are packed greedily and a single word
 * wider than `maxWidth` is kept whole on its own line (never dropped or split).
 *
 * Width is measured by the injected `measure(str) -> number` callback — the
 * pure wrapping logic lives here; the canvas/DOM text-measurement stays at the
 * call site (pass `ctx.measureText(s).width`). `maxWidth` is coerced to a finite
 * number (non-finite -> 0); a limit of 0 (or less) disables width-wrapping, so
 * only explicit newlines break the text and `measure` is never called.
 *
 * Node-importable ES module. A tool whose pure, unit-tested source/logic.mjs
 * wraps text imports this module directly (so `node --test` can load it, feeding
 * a deterministic `measure`); the single-file build inlines this module body
 * into the shipped index.html — stripping the `export` — so the shipped tool
 * stays dependency-free and file://-openable. See the consuming repo's build
 * docs (§ "Build-assembled tools" › import inlining).
 *
 * This is a shared component. Edit the canonical copy and re-vendor; every tool
 * picks it up on its next build. No hash to recompute.
 */
function wrapText(text, maxWidth, measure) {
  const src = text == null ? '' : String(text);
  const mw = Number(maxWidth);
  const limit = Number.isFinite(mw) ? mw : 0;
  const paras = src.split('\n');
  const out = [];
  for (const para of paras) {
    const words = para.split(/(\s+)/).filter((t) => t.length > 0);
    if (words.length === 0) { out.push(''); continue; }
    let line = '';
    for (const token of words) {
      const isSpace = /^\s+$/.test(token);
      const candidate = line + token;
      if (line === '') {
        line = isSpace ? '' : token;
        continue;
      }
      if (limit > 0 && measure(candidate) > limit && !isSpace) {
        out.push(line.replace(/\s+$/, ''));
        line = token;
      } else {
        line = candidate;
      }
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out.length ? out : [''];
}

class CtUtil {

    // ===== BEGIN PURE-LOGIC (unit-tested by tests/unit/*.test.mjs via
    // tests/unit/extract-inline-module.mjs — keep this region free of
    // document/window/localStorage access; see that file for the convention) =====
    // =====================================================================
    // 1. Constants
    // =====================================================================
    const MAX_LEN = 80;
    const STORAGE_KEY = 'hat-picker:v1';
    const HELP_SEEN_KEY = 'hat-picker:help-seen:v1';
    const CYCLE_DURATION_MS = 2000;
    const CYCLE_MIN_STEP_MS = 40;
    const CYCLE_MAX_STEP_MS = 260;
    const SHAKE_DURATION_MS = 320;
    const CONFETTI_COLORS = ['#ff6f59', '#4ecdc4', '#ffd166', '#ef476f', '#06d6a0', '#7b61ff'];
    const CONFETTI_PARTICLE_COUNT = 110;

    // =====================================================================
    // 2. Pure functions
    // =====================================================================

    // Pure, testable, no side effects, no closures over app state.
    // rng() must return a float in [0, 1).
    function pickIndex(count, rng = defaultRng) {
      if (count <= 0) throw new RangeError('pickIndex: count must be > 0');
      return Math.floor(rng() * count);
    }

    // Default rng backed by crypto.getRandomValues. Dividing a uniform Uint32
    // by 2^32 then flooring by `count` has a theoretical modulo-bias only when
    // `count` doesn't evenly divide 2^32; at the small entry counts a hat
    // picker realistically has, that bias is far below any measurable
    // threshold — the same accepted tradeoff Math.random()-based code makes,
    // just backed by a CSPRNG. Not worth full rejection sampling here.
    function defaultRng() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] / 4294967296; // 2^32
    }

    function isBlank(text) {
      return text.trim().length === 0;
    }

    // Trims and hard-caps to MAX_LEN. Used both by addEntry (defense in depth
    // against paste bypassing the input's maxlength) and by the live counter.
    function clampText(text) {
      return text.trim().slice(0, MAX_LEN);
    }

    // Exact-text duplicate check against the current entry list. Used by
    // addEntry() to reject a second entry with identical (already-clamped)
    // text.
    function isDuplicateText(entries, text) {
      return entries.some((e) => e.text === text);
    }

    // Pure list transformation: returns a NEW array with the entry matching
    // `id` removed (does not mutate `entries`). Used by both removeEntry()
    // (the trash-button/confirm path) and draw()'s "remove winner after
    // draw" no-repeat behavior.
    function removeEntryById(entries, id) {
      return entries.filter((e) => e.id !== id);
    }

    // Test-only export surface — inert in the browser (nothing in this page
    // imports this module, so `export` here is a no-op) except when

    // Node. See tests/unit/extract-inline-module.mjs.
    export {
      MAX_LEN, pickIndex, defaultRng, isBlank, clampText, isDuplicateText, removeEntryById,
    };
    // ===== END PURE-LOGIC =====

    // =====================================================================
    // 3. State
    // =====================================================================

    /** @type {{id: string, text: string}[]} */
    let entries = [];

    let settings = {
      removeWinnerAfterDraw: false,
    };

    let drawState = {
      phase: 'idle', // 'idle' | 'cycling' | 'revealed'
      winnerId: null,
      winnerText: '',
      cycleHandle: null,
    };

    let confettiParticles = [];
    let confettiRafHandle = null;

    // DOM refs
    const els = {
      form: document.getElementById('add-form'),
      input: document.getElementById('entry-input'),
      addButton: document.getElementById('add-button'),
      charCounter: document.getElementById('char-counter'),
      entryList: document.getElementById('entry-list'),
      entryCount: document.getElementById('entry-count'),
      emptyState: document.getElementById('empty-state'),
      pullButton: document.getElementById('pull-button'),
      drawAgainButton: document.getElementById('draw-again-button'),
      removeWinnerToggle: document.getElementById('remove-winner-toggle'),
      clearAllButton: document.getElementById('clear-all'),
      winnerReveal: document.getElementById('winner-reveal'),
      winnerCopy: document.getElementById('winner-copy'),
      winnerAnnounce: document.getElementById('winner-announce'),
      confettiCanvas: document.getElementById('confetti-canvas'),
      helpButton: document.getElementById('help-button'),
    };

    const confettiCtx = els.confettiCanvas.getContext('2d');

    // =====================================================================
    // 4. Persistence
    // =====================================================================

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries, settings }));
      } catch (err) {
        // Best-effort: localStorage unavailable (file://, private mode, quota,
        // browser policy). Degrade silently to in-memory only.
      }
    }

    function loadState() {
      const fallback = { entries: [], settings: { removeWinnerAfterDraw: false } };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        const loadedEntries = Array.isArray(parsed.entries)
          ? parsed.entries.filter((e) => e && typeof e.id === 'string' && typeof e.text === 'string')
          : [];
        const loadedSettings = {
          removeWinnerAfterDraw: !!(parsed.settings && parsed.settings.removeWinnerAfterDraw),
        };
        return { entries: loadedEntries, settings: loadedSettings };
      } catch (err) {
        return fallback;
      }
    }

    // =====================================================================
    // 5. Rendering
    // =====================================================================

    function renderCounter() {
      const len = els.input.value.length;
      els.charCounter.textContent = `${len} / ${MAX_LEN}`;
      els.charCounter.classList.toggle('near-limit', len >= 70);
    }

    function renderEntries() {
      els.entryList.innerHTML = '';
      const hasEntries = entries.length > 0;
      els.emptyState.hidden = hasEntries;
      els.entryList.hidden = !hasEntries;

      for (const entry of entries) {
        const li = document.createElement('li');
        li.dataset.testid = 'entry-row';
        li.dataset.id = entry.id;

        const span = document.createElement('span');
        span.className = 'entry-text';
        span.textContent = entry.text; // never innerHTML — no markup injection

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.dataset.testid = 'entry-remove';
        removeBtn.setAttribute('aria-label', `Remove ${entry.text}`);
        removeBtn.title = 'Remove entry';
        removeBtn.textContent = '×';

        li.append(span, removeBtn);
        els.entryList.appendChild(li);
      }

      els.entryCount.textContent = `${entries.length} in the hat`;
    }

    function renderDrawButtons() {
      const busy = drawState.phase === 'cycling';
      const canDraw = entries.length >= 2 && !busy;
      const hasDrawnBefore = drawState.phase === 'revealed';

      els.pullButton.hidden = hasDrawnBefore;
      els.drawAgainButton.hidden = !hasDrawnBefore;
      els.pullButton.disabled = !canDraw;
      els.drawAgainButton.disabled = !canDraw;
    }

    function renderAll() {
      renderCounter();
      renderEntries();
      renderDrawButtons();
    }

    // =====================================================================
    // 6. Entry mutations
    // =====================================================================

    function shakeInput() {
      // Restart the shake animation even on rapid re-triggers (remove class,
      // force reflow, re-add) via the shared helper.
      restartAnimation(els.input, 'shake');
      setTimeout(() => els.input.classList.remove('shake'), SHAKE_DURATION_MS);
    }

    // crypto.randomUUID() is SECURE-CONTEXT ONLY (HTTPS / localhost / file://).
    // Served over plain HTTP on a LAN it is `undefined` and throws, which would
    // silently break adding entries. Build an id from crypto.getRandomValues
    // (available in any context) with a Math.random fallback, so Add works
    // everywhere the tool might be hosted.
    function newId() {
      try {
        const b = new Uint8Array(16);
        crypto.getRandomValues(b);
        return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }
    }

    function addEntry(rawText) {
      const text = clampText(String(rawText ?? ''));
      if (isBlank(text)) {
        shakeInput();
        return false;
      }
      const isDuplicate = isDuplicateText(entries, text);
      if (isDuplicate) {
        shakeInput();
        return false;
      }

      entries.push({ id: newId(), text });
      els.input.value = '';
      saveState();
      renderAll();
      // Blur (not focus) on a successful add: there's no dedicated API to
      // dismiss the on-screen mobile keyboard — it follows DOM focus, so
      // blurring the input is what hides it after tapping Add on iOS/Android.
      // A REJECTED add (blank/duplicate, above) does NOT blur — the input
      // keeps focus so the user can immediately fix and resubmit.
      els.input.blur();
      return true;
    }

    function removeEntry(id) {
      entries = removeEntryById(entries, id);
      // If the removed entry was the revealed winner, keep showing the
      // captured winnerText — do not blank the reveal card.
      saveState();
      renderAll();
    }

    function clearAll() {
      cancelInFlightAnimations();
      entries = [];
      drawState = { phase: 'idle', winnerId: null, winnerText: '', cycleHandle: null };
      els.winnerReveal.textContent = 'Ready when you are!';
      els.winnerReveal.setAttribute('aria-hidden', 'true');
      els.winnerReveal.classList.remove('bounce');
      // Back to the placeholder state — hide the in-field copy button again.
      els.winnerCopy.hidden = true;
      saveState();
      renderAll();
    }

    function cancelInFlightAnimations() {
      if (drawState.cycleHandle != null) {
        cancelAnimationFrame(drawState.cycleHandle);
        drawState.cycleHandle = null;
      }
      stopConfetti();
    }

    // =====================================================================
    // 7. Draw logic
    // =====================================================================

    function lockUI(locked) {
      els.input.disabled = locked;
      els.addButton.disabled = locked;
      els.clearAllButton.disabled = locked;
      els.removeWinnerToggle.disabled = locked;
      for (const btn of els.entryList.querySelectorAll('[data-testid="entry-remove"]')) {
        btn.disabled = locked;
      }
      if (locked) {
        els.pullButton.disabled = true;
        els.drawAgainButton.disabled = true;
      } else {
        renderDrawButtons();
      }
    }

    function setReelText(text) {
      els.winnerReveal.textContent = text;
    }

    function triggerBounce() {
      restartAnimation(els.winnerReveal, 'bounce');
      els.winnerReveal.addEventListener(
        'animationend',
        () => els.winnerReveal.classList.remove('bounce'),
        { once: true }
      );
    }

    function revealWinner(entry) {
      drawState.phase = 'revealed';
      drawState.winnerId = entry.id;
      drawState.winnerText = entry.text;
      els.winnerReveal.textContent = entry.text;
      els.winnerReveal.removeAttribute('aria-hidden');
      // Reveal the in-field copy button now that there's a real winner value to
      // copy (it stays hidden over the idle "Ready when you are!" placeholder).
      els.winnerCopy.hidden = false;
      // Announced exactly once per draw, here only — not per animation frame.
      // Mirrors winner-reveal's text exactly (winner-reveal and
      // winner-announce are separate elements, but must always agree).
      els.winnerAnnounce.textContent = entry.text;
      renderDrawButtons();
    }

    // Time-based RAF cycle: starts fast, decelerates (ease-out cubic), and
    // lands exactly on winnerEntry.text. Resolves once landing text + bounce
    // have started, not after the full bounce keyframe finishes.
    function runCycleAnimation(winnerEntry) {
      return new Promise((resolve) => {
        const startTime = performance.now();
        let lastStepTime = startTime;
        let cursorIndex = 0;

        function frame(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / CYCLE_DURATION_MS, 1);
          const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
          const currentStepMs = CYCLE_MIN_STEP_MS + (CYCLE_MAX_STEP_MS - CYCLE_MIN_STEP_MS) * eased;

          if (now - lastStepTime >= currentStepMs) {
            lastStepTime = now;
            // Cosmetic-only display index. Math.random() is fine here — this
            // never touches the actual winner decision, which was already
            // fixed via pickIndex() before this function was called. Do not
            // confuse this with selection logic.
            const step = entries.length > 1 ? 1 + Math.floor(Math.random() * (entries.length - 1)) : 1;
            cursorIndex = (cursorIndex + step) % entries.length;
            setReelText(entries[cursorIndex].text);
          }

          if (t >= 1) {
            setReelText(winnerEntry.text); // guarantee exact landing text
            triggerBounce();
            resolve();
            return;
          }
          drawState.cycleHandle = requestAnimationFrame(frame);
        }
        drawState.cycleHandle = requestAnimationFrame(frame);
      });
    }

    async function draw({ instant = false, forceIndex } = {}) {
      if (drawState.phase === 'cycling') return; // guard re-entry
      if (entries.length < 2) return; // guard (button should already be disabled)

      if (
        forceIndex !== undefined &&
        (forceIndex < 0 || forceIndex >= entries.length || !Number.isInteger(forceIndex))
      ) {
        return; // invalid forceIndex — forgiving no-op for test convenience
      }

      const winnerIndex = forceIndex ?? pickIndex(entries.length, defaultRng);
      const winner = entries[winnerIndex];
      if (!winner) return;

      lockUI(true);
      drawState.phase = 'cycling';
      drawState.winnerId = null;

      // Checked fresh on every draw (not cached at module load) so a
      // mid-session OS setting change is honored on the next draw.
      const reducedMotion = prefersReducedMotion();

      if (instant || reducedMotion) {
        revealWinner(winner);
      } else {
        await runCycleAnimation(winner);
        revealWinner(winner);
        startConfetti();
      }

      lockUI(false);

      if (settings.removeWinnerAfterDraw) {
        removeEntry(winner.id); // keeps drawState.winnerText intact
      }
    }

    // =====================================================================
    // 8. Confetti
    // =====================================================================

    function resizeConfettiCanvas() {
      // Shared HiDPI canvas setup (CtUtil.mjs). Sizes the backing store
      // to window CSS px * dpr, sets the CSS pixel size, and applies the dpr
      // transform to the 2d context (same context object as confettiCtx).
      setupHiDPICanvas(els.confettiCanvas, {
        width: window.innerWidth,
        height: window.innerHeight,
      });
    }

    function makeParticle(originX, originY) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 6;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4, // slight upward bias for a "burst"
        gravity: 0.15 + Math.random() * 0.08,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12,
        size: 5 + Math.random() * 5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        life: 1,
        decay: 0.006 + Math.random() * 0.006,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
      };
    }

    function startConfetti() {
      const rect = els.winnerReveal.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      for (let i = 0; i < CONFETTI_PARTICLE_COUNT; i++) {
        confettiParticles.push(makeParticle(originX, originY));
      }
      if (confettiRafHandle == null) {
        confettiRafHandle = requestAnimationFrame(confettiTick);
      }
    }

    function confettiTick() {
      confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      confettiParticles = confettiParticles.filter((p) => {
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;
        p.life -= p.decay;
        return p.life > 0 && p.y < window.innerHeight + 40;
      });

      for (const p of confettiParticles) {
        confettiCtx.save();
        confettiCtx.globalAlpha = Math.max(p.life, 0);
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.fillStyle = p.color;
        if (p.shape === 'rect') {
          confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        } else {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          confettiCtx.fill();
        }
        confettiCtx.restore();
      }

      if (confettiParticles.length === 0) {
        stopConfetti();
        return;
      }
      confettiRafHandle = requestAnimationFrame(confettiTick);
    }

    function stopConfetti() {
      if (confettiRafHandle != null) {
        cancelAnimationFrame(confettiRafHandle);
        confettiRafHandle = null;
      }
      confettiParticles = [];
      confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    // =====================================================================
    // 8b. Help modal -- purely informational (what the tool does + how to use
    // it). Built by the shared jbcModal primitive (lib/components/CtModal.mjs) from
    // the hidden #help-body template. The whole focus-trap / Esc + backdrop
    // close / focus-return / reduced-motion / scroll-top contract lives in that
    // one primitive now (was hand-rolled here). `testid: 'help'` keeps the
    // help-overlay / help-modal / modal-close-x test hooks; `titleId` pins the
    // aria-labelledby target; `autoOpen` rides the shared onceFlag so
    // the modal auto-shows once on a fresh visit and never again.
    // =====================================================================

    const help = createModal({
      testid: 'help',
      titleId: 'help-title',
      title: 'How Hat Picker works',
      body: document.getElementById('help-body').content.cloneNode(true),
      autoOpen: onceFlag(HELP_SEEN_KEY),
    });

    // =====================================================================
    // 9. Event wiring
    // =====================================================================
    // Destructive actions (per-entry remove, Clear all) confirm via the
    // shared confirmDialog(message) component (lib/components/CtConfirm.mjs, pasted
    // above as a classic <script>) rather than a bespoke modal — see
    // docs/conventions.md's "Destructive actions require confirmation".
    // window.__hatPicker.removeEntry(id)/clear() remain direct, non-modal
    // calls (used here only after confirmDialog resolves true, and by tests).

    els.form.addEventListener('submit', (e) => {
      e.preventDefault();
      addEntry(els.input.value);
    });

    els.input.addEventListener('input', renderCounter);

    // Event delegation for remove buttons — simpler than per-row listeners.
    els.entryList.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-testid="entry-remove"]');
      if (!btn || btn.disabled) return;
      const li = btn.closest('[data-testid="entry-row"]');
      if (!li) return;
      const { id } = li.dataset;
      if (await confirmDialog('Remove this entry?')) removeEntry(id);
    });

    els.pullButton.addEventListener('click', () => draw());
    els.drawAgainButton.addEventListener('click', () => draw());

    // In-field copy for the winner value (docs/conventions.md "In-field copy
    // button"). Uses the shared copy/flash (CtClipboardUtil.mjs). winnerText is the
    // exact revealed winner, so it stays correct even after "remove winner
    // after draw" takes the entry out of the hat.
    els.winnerCopy.addEventListener('click', async () => {
      const text = drawState.winnerText || els.winnerReveal.textContent.trim();
      if (!text) return;
      const ok = await copy(text);
      if (!ok) return;
      flash(els.winnerCopy, { label: '✅', revertTo: '📋' });
    });

    els.removeWinnerToggle.addEventListener('change', () => {
      settings.removeWinnerAfterDraw = els.removeWinnerToggle.checked;
      saveState();
    });

    els.clearAllButton.addEventListener('click', async () => {
      if (entries.length === 0) return; // nothing to clear
      if (await confirmDialog('Remove all entries?')) clearAll();
    });

    window.addEventListener('resize', resizeConfettiCanvas);

    els.helpButton.addEventListener('click', () => help.open());

    // =====================================================================
    // 10. Init
    // =====================================================================

    (function init() {
      const loaded = loadState();
      entries = loaded.entries;
      settings = loaded.settings;
      els.removeWinnerToggle.checked = settings.removeWinnerAfterDraw;
      resizeConfettiCanvas();
      renderAll();
      // The Help modal auto-shows itself once on a fresh visit — jbcModal's
      // `autoOpen` handle (above) owns that "once" gate now.
    })();

    // =====================================================================
    // 11. Test hooks — inert for normal use, enables deterministic
    // Playwright assertions.
    // =====================================================================
    window.__hatPicker = {
      get entries() {
        return entries.map((e) => ({ ...e }));
      },
      get settings() {
        return { ...settings };
      },
      get drawState() {
        return { ...drawState };
      },
      addEntry,
      removeEntry,
      clear: clearAll,
      pickIndex,
      defaultRng,
      draw,
    };
  </script>
</body>
</html>
